<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebebe9">
<title>Liftless</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  /* Colours from the Broken Compass logo: teal, mustard, rose, red on light grey. */
  --bg:#ebebe9; --panel:#fff; --line:#dddad5; --text:#1d1b1a; --dim:#635f5a;
  --accent:#24766f; --on-accent:#fff; --ok:#1f6e67; --on-ok:#fff; --warn:#8a5a00; --bad:#c93330; --chip:#f1efeb;
  --mustard:#d9962a; --rose:#c2647e; --teal:#2f8c85;
  --scrim:rgba(10,12,14,.45); --hdr:52px; --bar:84px; --nav:56px; --rir:100px; --next:64px;
  --rirH:0px; --nextH:0px;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141312; --panel:#1d1c1a; --line:#302d2a; --text:#ecebe8; --dim:#9b968f;
    --accent:#3fa89f; --on-accent:#0a1f1d; --ok:#3fa89f; --on-ok:#0a1f1d; --warn:#e3a843; --bad:#e2625b; --chip:#272523;
    --mustard:#e3a843; --rose:#d77d96; --teal:#3fa89f;
    --scrim:rgba(0,0,0,.6);
  }
}
/* 5-23 uplift: bundled fonts (SIL OFL, fonts/OFL-*.txt). Baloo 2 is rounded
   like the logo's letters, for headings and the wordmark; Nunito Sans for
   reading. Latin and latin-ext (Czech) only, loaded on demand by range. */
@font-face{font-family:"Baloo 2"; font-weight:400 800; font-display:swap; src:url(fonts/baloo2-latin.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Baloo 2"; font-weight:400 800; font-display:swap; src:url(fonts/baloo2-latin-ext.woff2) format("woff2"); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito Sans"; font-weight:400 800; font-display:swap; src:url(fonts/nunitosans-latin.woff2) format("woff2"); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito Sans"; font-weight:400 800; font-display:swap; src:url(fonts/nunitosans-latin-ext.woff2) format("woff2"); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{ --f-body:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --f-display:"Baloo 2","Nunito Sans",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); overflow-x:hidden;
  font:16px/1.45 var(--f-body);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.bigv,.liftc .lv,#barT,.welcome h2{font-family:var(--f-display)}
h3{font-size:18px; font-weight:700; margin:0 0 4px; letter-spacing:.1px}
.big{font-family:var(--f-display); font-weight:700; font-size:19px; border-radius:16px}
.big .lines2{font-family:var(--f-body); font-weight:600}
.rowbtn,.liftc{border-radius:16px}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
input,select,textarea{font:inherit; font-size:16px}
[hidden]{display:none !important}

/* ---- header */
header{
  position:sticky; top:0; z-index:30; background:var(--panel);
  border-bottom:1px solid var(--line); padding:0 6px 0 14px; padding-top:var(--safe-t);
  display:flex; align-items:center; gap:8px; min-height:calc(var(--hdr) + var(--safe-t));
}
header h1{font-size:20px; font-weight:700; margin:0; flex:1; min-width:0; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1}
/* The wordmark: the logo's four colours, letter by letter, only when the
   header says "Liftless". */
header h1.wm{font-size:26px; font-weight:800; letter-spacing:.5px}
header h1.wm span:nth-child(4n+1){color:var(--mustard)} header h1.wm span:nth-child(4n+2){color:var(--teal)}
header h1.wm span:nth-child(4n+3){color:var(--rose)} header h1.wm span:nth-child(4n+4){color:var(--bad)}
#datechip{font-size:12.5px; padding:3px 9px; border-radius:99px; background:var(--chip); color:var(--dim); white-space:nowrap}
#datechip.amber{color:var(--warn); background:rgba(217,150,42,.15)}
#sync{font-size:12px; padding:4px 9px; border-radius:99px; background:var(--chip); color:var(--dim); white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis}
#sync.ok{color:var(--ok)} #sync.pending{color:var(--warn)} #sync.bad{color:var(--bad)}
.ib{width:44px; height:44px; min-width:44px; border:none; background:none; border-radius:10px; font-size:20px; line-height:1; color:var(--dim)}
.ib:active{background:var(--chip)}

main{padding:12px 12px 0; max-width:640px; margin:0 auto; padding-bottom:calc(var(--nav) + var(--safe-b) + 90px)}
body.chips{--rirH:var(--rir)}
body.next{--nextH:var(--next)}
body.ses main{padding-bottom:calc(var(--bar) + var(--rirH) + var(--nextH) + var(--safe-b) + 40px)}
/* Shown only if the page script never ran (for example a module that failed
   to load on a patchy signal mid-update). render() replaces it at once. */
#bootmsg{opacity:0; animation:appear 0s 4s forwards}
@keyframes appear{to{opacity:1}}

/* ---- common */
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; scroll-margin-top:calc(var(--hdr) + var(--safe-t) + 8px); box-shadow:0 1px 2px rgba(30,25,20,.04), 0 4px 14px rgba(30,25,20,.04)}
.card h3{margin:0; font-size:16px; line-height:1.25; overflow-wrap:anywhere}
.sub{color:var(--dim); font-size:13px}
.center{text-align:center}
.grow{flex:1; min-width:0}
.row{display:flex; gap:8px; align-items:center}
label{display:block; font-size:13px; color:var(--dim); margin:12px 0 4px}
input,select,textarea{width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text)}
textarea{min-height:90px; resize:vertical}
.btn{min-height:48px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:15px}
.btn.primary,.big.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn.danger{color:var(--bad)}
.btn[disabled],.big[disabled],.rowbtn[disabled]{opacity:.45; cursor:default}
.w100{width:100%}
.big{display:block; width:100%; min-height:56px; border-radius:12px; border:1px solid var(--line); font-size:17px; margin:4px 0 8px; padding:10px 14px}
.rowbtn{display:flex; align-items:center; gap:10px; width:100%; min-height:56px; text-align:left; padding:8px 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:8px}
.pill{display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--chip); color:var(--dim); margin-right:4px; white-space:nowrap}
.pill.warn{color:var(--warn)} .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}
.banner{border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:10px}
.banner.warn{background:rgba(217,150,42,.13); border:1px solid rgba(217,150,42,.35)}
.banner.bad{background:rgba(201,51,48,.11); border:1px solid rgba(201,51,48,.32)}
.banner.info{background:rgba(47,140,133,.09); border:1px solid rgba(47,140,133,.28)}
.banner .row{margin-top:8px}
.banner .btn{flex:1}
.hint{font-size:13px; color:var(--dim); margin-top:6px}
.empty{text-align:center; color:var(--dim); padding:30px 10px; font-size:14px}

/* ---- exercise cards */
.exhead{display:flex; align-items:center; gap:2px; margin:-6px -6px 0 0}
.exhead h3{flex:1; min-width:0}
.tline{font-size:13.5px; color:var(--dim); margin:2px 0 8px; font-variant-numeric:tabular-nums}
.info{font-size:13.5px; color:var(--dim); border-top:1px solid var(--line); padding-top:6px; margin-bottom:8px}
.info p{margin:6px 0}
.info b{color:var(--text)}
.setrow{display:grid; grid-template-columns:44px 1fr 56px; gap:8px; align-items:center; min-height:56px; margin-bottom:6px}
.sn{text-align:center; color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums}
.setrow.warm .sn{color:var(--warn); font-weight:700}
.val{min-height:56px; border:1px solid var(--line); border-radius:10px; background:var(--bg); text-align:left; padding:0 12px; color:var(--dim); font-size:17px; font-variant-numeric:tabular-nums; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.setrow.done .val{color:var(--text); font-weight:650}
.tick{width:56px; height:56px; border-radius:12px; border:1px solid var(--line); background:var(--chip); font-size:22px; color:var(--dim)}
.setrow.done .tick{background:var(--ok); border-color:var(--ok); color:var(--on-ok)}
.setrow.legacy .tick{background:var(--chip); border-color:var(--line); color:var(--ok)}
.exfoot{display:flex; gap:8px; margin-top:4px}
.exnote{margin:6px 0 2px}
button.exnote{display:block; width:100%; min-height:44px; text-align:left; padding:8px 12px; border:1px dashed var(--line); border-radius:10px; background:none; color:var(--dim); font-size:14px}
.formlink{color:var(--accent); font-weight:600; text-decoration:none}
.exfoot button{flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:14.5px}
.exline{display:flex; align-items:center; gap:8px; width:100%; min-height:56px; border:none; background:none; text-align:left; padding:0 4px; font-size:15.5px}
.card.collapsed{padding:0 8px}
.exline .cs{margin-left:auto; color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap}
.exline.ok .cs{color:var(--ok); font-weight:600}
.exline b{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---- bottom nav and session bar */
#tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--safe-b)}
#tabs button{flex:1; min-height:var(--nav); border:none; background:none; color:var(--dim); font-size:12.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding-top:4px}
#tabs button svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
#tabs button.on{color:var(--accent); font-weight:800}
#tabs button.on svg{stroke-width:2.4}
#bar{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--safe-b)}
.barin{display:flex; align-items:center; gap:8px; height:var(--bar); padding:0 12px}
/* The timer is read from arm's length between sets, so it is the biggest
   thing on the bar. */
#barT{min-width:150px; min-height:64px; border:none; background:none; text-align:left; font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; padding:0 4px; line-height:1}
#barT small{display:block; font-size:13px; font-weight:500; color:var(--dim); line-height:1.2}
#barT.over{color:var(--ok)}
#plus30{min-width:64px; min-height:56px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:16px; font-weight:600}
#finBtn{width:120px; min-height:48px; border-radius:12px; border:none; background:var(--accent); color:var(--on-accent); font-weight:650; font-size:16px; margin-left:auto}
/* The next set's ✓, in thumb reach at the bottom of the screen. */
#nextSet{display:flex; align-items:center; gap:10px; width:calc(100% - 24px); height:56px; margin:8px 12px 0; padding:0 14px; border:none; border-radius:12px; background:var(--ok); color:var(--on-ok); text-align:left; font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; overflow:hidden}
#nextSet.enter{background:var(--chip); color:var(--text); border:1px solid var(--line)}
#nextSet .nx{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#nextSet small{display:block; font-size:12px; font-weight:500; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#nextSet .ck{font-size:24px}
.shrest{font-size:22px; font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums}
.shrest.over{color:var(--ok)}
#rirRow{border-bottom:1px solid var(--line); padding:6px 12px 10px}
#rirRow.last{border-top:2px solid var(--accent); background:rgba(47,140,133,.07)}
.rirlab{display:flex; align-items:center; font-size:14px; font-weight:600; min-height:32px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{min-width:56px; min-height:48px; flex:1; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:17px; font-weight:600; padding:0 8px}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chip.s48{min-width:48px}
.chips.small .chip{flex:0 1 auto; font-size:15px; font-weight:500}

/* ---- sheets */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:40}
.panel{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--panel); border-radius:16px 16px 0 0; max-height:88vh; overflow-y:auto; padding:10px 14px calc(14px + var(--safe-b)); max-width:640px; margin:0 auto; overscroll-behavior:contain}
.panel.full{top:0; max-height:none; border-radius:0; padding-top:calc(10px + var(--safe-t))}
.grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 8px}
.sh-h{font-weight:650; font-size:16px; margin:2px 0 6px; display:flex; align-items:center; gap:8px}
.step{display:grid; grid-template-columns:56px 1fr 56px; gap:8px; align-items:center}
.step button{height:56px; border-radius:12px; border:1px solid var(--line); background:var(--chip); font-size:24px}
.step input{height:56px; text-align:center; font-size:22px; font-weight:650; font-variant-numeric:tabular-nums}
.toggle{min-height:48px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--chip)}
.toggle.on{border-color:var(--warn); color:var(--warn); font-weight:650}
.textbtn{min-height:48px; padding:0 12px; border:none; background:none; color:var(--bad); font-size:15px}
.textbtn.plain{color:var(--accent)}
.save56{display:block; width:100%; min-height:56px; margin-top:16px; border:none; border-radius:12px; background:var(--accent); color:var(--on-accent); font-size:17px; font-weight:650}
.save56[disabled]{opacity:.4; cursor:default}
.menu button{display:block; width:100%; min-height:56px; text-align:left; padding:0 14px; border:none; border-bottom:1px solid var(--line); background:none; font-size:16px}
.menu button.danger{color:var(--bad); margin-top:16px; border-top:1px solid var(--line)}
.fsec{border-top:1px solid var(--line); padding:12px 0}
.fsec h4{margin:0 0 8px; font-size:14.5px}
.fsec.hl{background:rgba(217,150,42,.08); border-radius:10px; padding:12px 8px}
.sumline{font-size:14px; padding:3px 0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.warnbox{background:rgba(217,150,42,.13); border:1px solid rgba(217,150,42,.35); border-radius:12px; padding:10px}
.warnbox .row{margin-top:8px}
.warnbox .btn{flex:1; font-size:14px; padding:8px}
.warnbox .btn.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.pinch{font-size:13.5px; margin-top:8px; color:var(--bad)}

/* ---- history */
.hrow{display:flex; align-items:center; gap:8px; width:100%; min-height:56px; border:none; background:none; text-align:left; padding:4px 2px; flex-wrap:wrap}
.hist{border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hdet{padding:0 2px 12px; font-size:13.5px; color:var(--dim)}
.hdet b{color:var(--text)}
.hdet .row{margin-top:10px}
.hdet .row .btn{min-height:44px; flex:1}
.hdet .row .btn + .btn{margin-left:8px}

/* ---- onboarding, programme, library (friends only) */
body.friend{--rir:136px}
.qbar{display:flex; gap:4px; margin:4px 0 14px}
.qbar span{flex:1; height:4px; border-radius:2px; background:var(--line)}
.qbar span.on{background:var(--accent)}
.qh{font-size:20px; line-height:1.3; margin:4px 0 10px}
.rowbtn.q{min-height:64px}
.rowbtn.q.on,.rowbtn.q.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.rowbtn.q:active{background:var(--chip)}
.rowbtn .ck{font-size:20px; color:var(--accent); min-width:24px; text-align:right}
.lines2{display:block; font-size:13px; font-weight:500; opacity:.85}
/* ---- home and lift page (5-21) */
.pbar.ontabs{bottom:calc(var(--nav) + var(--safe-b)); padding-bottom:8px; border-top:none; background:linear-gradient(to bottom, transparent, var(--bg) 30%)}
body.pbarTabs main{padding-bottom:calc(var(--nav) + var(--safe-b) + 110px)}
#coachFab{position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(var(--nav) + var(--safe-b) + 92px); z-index:26; width:56px; height:56px; border-radius:99px; border:none; background:var(--rose); color:#fff; font-size:13px; font-weight:800; box-shadow:0 6px 18px rgba(0,0,0,.2)}
body:not(.pbarTabs) #coachFab{bottom:calc(var(--nav) + var(--safe-b) + 16px)}
.weekc .wrow{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.weekc .streak{font-size:13px; font-weight:750; color:var(--warn)}
.wdots{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin:10px 0 2px}
.wdots i{height:30px; border-radius:9px; background:var(--chip); display:grid; place-items:center; font-style:normal; font-size:11.5px; font-weight:700; color:var(--dim)}
.wdots i.d{background:var(--accent); color:var(--on-accent)}
.wdots i.t{outline:2px solid var(--mustard); outline-offset:-2px}
.liftc{display:grid; grid-template-columns:minmax(0,1fr) 96px; grid-template-rows:auto auto auto; column-gap:12px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; color:var(--text)}
.liftc .ln1{font-weight:750; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.liftc .spark{grid-column:2; grid-row:1 / span 3; width:96px; height:44px; align-self:center}
.liftc .lv{font-size:24px; font-weight:750; font-variant-numeric:tabular-nums}
.liftc .lv small{font-size:12px; font-weight:500; color:var(--dim)}
.lch{font-size:12.5px; font-weight:700; color:var(--dim)}
.lch.up{color:var(--ok)}
.prb{display:inline-block; margin-left:8px; font-size:11px; font-weight:800; color:#fff; background:var(--mustard); border-radius:6px; padding:1px 6px; vertical-align:3px}
.spark .ln,.lchart .ln{fill:none; stroke:var(--teal); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.spark .fill,.lchart .fill{fill:var(--teal); fill-opacity:.13; stroke:none}
.spark .dot,.lchart .dot{fill:var(--teal)}
.spark .prdot,.lchart .prdot{fill:var(--mustard)}
.lchart{width:100%; height:auto; display:block; margin-top:8px}
.lchart .gl{stroke:var(--line); stroke-width:1}
.lchart .ax{fill:var(--dim); font-size:10.5px}
.bigv{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.bigv small{font-size:14px; font-weight:500; color:var(--dim)}
.rng{margin-top:8px}
.rect{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14.5px; margin-top:6px}
.rect th{text-align:left; font-size:12px; color:var(--dim); font-weight:600; padding:4px 6px}
.rect td{padding:8px 6px; border-top:1px solid var(--line)}
.rrow{display:grid; grid-template-columns:1fr auto 72px; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:14.5px}
.rrow:first-of-type{border-top:none}

<body>

<header>
  <button class="ib" id="backBtn" data-act="back" aria-label="Back" hidden>‹</button>
  <h1 id="title">Liftless</h1>
  <span id="datechip" hidden></span>
  <span id="sync">–</span>
  <button class="ib" id="menuBtn" data-act="menu" aria-label="Menu" hidden>⋯</button>
</header>

<main id="view"><div class="empty" id="bootmsg">Liftless did not start. This can happen on a weak signal just after an update. <a href="./">Reload</a></div></main>

<nav id="tabs">
  <button data-act="tab" data-tab="log" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Home</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>You</button>
</nav>

  <div id="rirRow" hidden></div>

  <div class="barin">
    <button id="barT" data-act="restStop" aria-label="Rest timer">0:00</button>
    <button id="plus30" data-act="rest30" hidden>+30s</button>
    <button id="finBtn" data-act="finish">Finish</button>
  </div>
</div>

<div id="sheet"></div>
<div id="toast" hidden></div>

<script type="module">
import * as E from './engine.js?v=5-23';
import { makeSync } from './sync.js?v=5-23';
import { makeCloud, pendingView, routeSave, resolveStorage, claimStorage, promoteToGithub, adoptAfterPull, explain, redactSecrets } from './cloud.js?v=5-23';
import * as L from './library.js?v=5-23';
import * as G from './programme.js?v=5-23';
import * as C from './coach.js?v=5-23';
import * as V from './logview.js?v=5-23';
import * as PG from './progress.js?v=5-23';
import * as HL from './health.js?v=5-23';

/* ---------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const today = () => E.localISO(new Date());
/* Comma or dot: Czech keyboards type 72,4. */
const num = v => { const s = String(v ?? '').trim().replace(',', '.'); if(s === '') return null; const n = parseFloat(s); return Number.isFinite(n) ? n : null; };
const newId = () => 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const mmss = sec => { const s = Math.abs(Math.round(sec)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const daysAgo = iso => E.daysBetween(iso, today());

/* ---------------------------------------------------------------- storage */
/* E.loadState decides what to trust: ledger_v5, or on the first run after the
   upgrade ledger_v4 / ledger_v3. Once v5 exists the older keys are never read
   again except for the token, because they are a frozen snapshot of upgrade
   day. Older keys are never written or deleted. Anything unreadable is copied
   aside as ledger_corrupt_<key>_<time> (Settings → Export includes them). */
const LS = E.LS_KEY;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function backupCorrupt(k, raw){
  try{
    for(let i = 0; i < localStorage.length; i++){
      const kk = localStorage.key(i);
      if(kk && kk.startsWith('ledger_corrupt_' + k + '_') && localStorage.getItem(kk) === raw) return;
    }
    localStorage.setItem('ledger_corrupt_' + k + '_' + Date.now(), raw);
  }catch(e){}
}
let bootNotice = null;
function load(){
  const r = E.loadState(lsGet);
  for(const b of r.backups) backupCorrupt(b.key, b.raw);
  bootNotice = r.notice;
  return r.state;
}
function corruptBackups(){
  const out = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      /* A raw copy of state can hold the GitHub token and account tokens. */
      if(k && k.startsWith('ledger_corrupt_')) out[k] = redactSecrets(localStorage.getItem(k));
    }
  }catch(e){}
  return out;
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ setSync('bad', 'storage full'); }
}

let S = load();

function setSync(cls, msg){ const el = $('#sync'); el.className = cls || ''; el.textContent = msg; }
const sync = makeSync({
  fetch: (u, i) => fetch(u, i), getState: () => S, save,
  onStatus: (c, m) => { if(c !== 'pending') ui.syncBad.github = c === 'bad'; setSync(c, m); if(c !== 'pending') softRender(); }
});
/* Account mode (beta, opt-in): sessions also go to Supabase once signed in.
   GitHub stays the default and, when it is set up, the source of history. */
/* Where this phone keeps its log, 'github' | 'account' | null (not yet).
   Decided from the state once; 'github' the first time GitHub settings are
   valid, 'account' only on a sign-in where GitHub never was. A blank token
   never changes it. It moves one way only: when GitHub becomes valid on an
   'account' phone, the phone becomes 'github', and what the account holds is
   offered to GitHub after the next pull shows what GitHub already has. */
function mode(){
  const before = S.storage;
  let m = resolveStorage(S, sync.cfgOk());
  if(m === 'account' && sync.cfgOk() && promoteToGithub(S, cloud.ownerId(), Date.now())){
    m = S.storage; ui.notice = 'promoted';
    setTimeout(() => { pullGithub().then(softRender); }, 0);
  }
  if(m !== before) save();
  return m;
}
/* Every GitHub pull goes through here, so sessions set aside by a promotion
   reach the GitHub queue as soon as GitHub's own list is known. */
function pullGithub(){
  return sync.pullHistory().then(ok => {
    const items = adoptAfterPull(S, ok);
    for(const it of items) sync.enqueue(it);
    save();
    if(items.length) sync.flushQueue();
    return ok;
  });
}
const cloud = makeCloud({
  fetch: (u, i) => fetch(u, i), getState: () => S, save,
  ownsHistory: () => mode() === 'account',
  checkProgramme: raw => checkProg(raw),
  onStatus: (c, m) => { ui.cloudStatus = [c, m]; if(c !== 'pending') ui.syncBad.account = c === 'bad'; if(mode() === 'account') setSync(c, m); if(c !== 'pending') softRender(); }
});
const cloudQ = () => S.cloudQueue || [];
/* What the views read as pending. In 'github' mode only the GitHub queue:
   the account queue is a copy and never feeds the views. In 'account' mode,
   the account queue too. */
const accountOwns = () => mode() === 'account';
const pend = () => pendingView(S.history, S.queue, cloudQ(), accountOwns());
/* 'github' mode: queued for GitHub exactly as before (a blank token just
   holds it), and for the account as a copy once it has been used on this
   phone. 'account' mode: the account only (held while signed out). */
function queueItem(item){
  const to = routeSave(mode(), cloud.inUse());
  if(to.github) sync.enqueue(item);
  if(to.account) cloud.enqueue(item);
}
/* 'account' mode only: anything left in the GitHub queue (saved before the
   first sign-in) moves to the account queue, unless a newer copy of the same
   session is already there. Never in 'github' mode, whatever the token. */
function adoptGithubQueue(){
  if(mode() !== 'account' || !S.queue.length) return;
  /* Never drops an item because a same-named copy is there: the newer one is
     kept, and only items already placed leave the GitHub queue. */
  const placed = new Set(cloud.adoptItems(S.queue.slice()));
  S.queue = S.queue.filter(q => !placed.has(q)); save();
}
function flushAll(opts){
  adoptGithubQueue();
  const a = sync.flushQueue(opts);
  return cloud.signedIn() ? Promise.all([a, cloud.flushQueue(opts), bodySync()]) : a;
}
/* 5-21: bodyweight and floor benchmarks live in the account. Signed in, every
   entry on the phone is sent in one upsert; on a phone without GitHub the
   queue then moves into the local list (GitHub would never take it); the
   account's entries are merged back in. A failure leaves everything on the
   phone for the next save, sign-in or reconnect. */
let bodyBusy = null;
const sameBody = (a, b) => a.date === b.date && a.type === b.type;
function bodySync(){
  if(!cloud.signedIn() || cloud.foreign()) return Promise.resolve();
  if(bodyBusy) return bodyBusy;
  bodyBusy = (async () => {
    try{
      const q = S.bwQueue.slice();
      await cloud.pushBody([...S.bw, ...q.map(({ qid, ...b }) => b)]);
      if(!sync.cfgOk()){
        for(const { qid, ...b } of q){ S.bw = S.bw.filter(x => !sameBody(x, b)); S.bw.push(b); }
        S.bwQueue = S.bwQueue.filter(x => !q.includes(x));
      }
      for(const b of await cloud.pullBody())
        if(!S.bw.some(x => sameBody(x, b)) && !S.bwQueue.some(x => sameBody(x, b))) S.bw.push(b);
      S.bw.sort((a, c) => (a.date < c.date ? 1 : -1)); save();
    }catch(e){ /* kept on the phone */ }
    finally{ bodyBusy = null; }
  })();
  return bodyBusy;
}
/* Every session as stored (never the migrated in-memory copies), for S7's
   copy to the account. */
function rawAll(){
  const m = new Map();
  for(const h of S.history) if(h && !h.deleted) m.set(E.fileKey(h), h);
  for(const q of pend()){ if(!q || !q.date) continue; if(q.deleted) m.delete(E.fileKey(q)); else m.set(E.fileKey(q), q); }
  return [...m.values()];
}
const dir = () => sync.dir();
const aHist = () => E.analysisHistory(S.history, pend());
const merged = () => E.mergedHistory(S.history, pend());

/* ---------------------------------------------------------------- who sees what */
/* A friend's own programme (generated from the five answers). Never on a
   GitHub phone and never on Dan's coach account, whatever is cached: those
   run the coach programme in engine.js exactly as before. */
/* Any programme the page runs is checked twice: the engine's shape check,
   then against its own answers (G.audit: every exercise still in the
   library and still suitable, e.g. nothing hard on a joint the person said
   hurts). A programme that fails is not run; the person sets it up again. */
function checkProg(raw){
  const n = E.normaliseProgramme(raw);
  const bad = G.audit(n, L);
  if(bad.length){ ui.badProg = raw; throw new Error('programme: ' + bad[0]); }
  return n;
}
let progMemo = { raw: undefined, owner: undefined, me: undefined, val: null };
function P(){
  if(S.storage === 'github' || S.coach || !S.programme) return null;
  /* Only the signed-in person's own programme (or, signed out, the last one
     signed in on this phone): never another account's cached copy. */
  const owner = S.programmeOwner || (S.cloudOwner && S.cloudOwner.id) || null;
  const me = cloud.signedIn() ? cloud.userId() : (S.cloud && S.cloud.lastUserId) || owner;
  if(progMemo.raw !== S.programme || progMemo.owner !== owner || progMemo.me !== me){
    let val = null;
    if(!(owner && me && owner !== me)) try{ val = checkProg(S.programme); }catch(e){ val = null; }
    progMemo = { raw: S.programme, owner, me, val };
  }
  return progMemo.val;
}
/* Swaps and the library need readable answers and slot info on every exercise. */
const canEdit = () => { const p = P(); return !!p && G.editable(p, L); };
/* The friends' app: not a GitHub phone, not Dan's coach account. */
const friend = () => S.storage !== 'github' && mode() !== 'github' && !S.coach;
/* A friend's phone, signed in, with no programme yet: the questions (or
   loading it). Signed out, the start page instead (G.entryScreen). */
const needsProgramme = () => friend() && mode() === 'account' && cloud.signedIn() && !P() && !S.draft;
/* Which full screen replaces the tabs, if any: G.entryScreen (pure, tested). */
function screen(){
  return G.entryScreen({ building: ui.building, storage: S.storage, mode: mode(), coach: !!S.coach, draft: S.draft,
    retake: !!(S.onboard && S.onboard.retake), programme: !!P(), signedIn: cloud.signedIn(), githubOk: sync.cfgOk(),
    hasData: [S.history, S.queue, S.bw, S.bwQueue].some(a => Array.isArray(a) && a.length), progLoad: ui.progLoad });
}
const genSession = d => !!d && E.isGeneratedKey(d.key) && !!P();
const libByName = new Map(L.EXERCISES.map(e => [e.n, e]));
const libById = new Map(L.EXERCISES.map(e => [e.id, e]));
/* Saved sessions from any generated programme, for the first-session hints. */
const genDone = () => merged().filter(s => s.programmeId).length;
const online = () => navigator.onLine !== false;
const rirLine = n => 'RIR ' + n + ': stop each set when you could still do ' + n + ' more good rep' + (n === 1 ? '' : 's') + '.';
function equipText(a){
  if(!a) return '';
  const kit = [a.has && a.has.bar ? 'pull-up bar' : '', a.has && a.has.bands ? 'bands' : ''].filter(Boolean);
  return G.PLACE_TEXT[a.place] + (a.place !== 'gym' && kit.length ? ' + ' + kit.join(' + ') : '');
}
function doseText(e){
  const r = e.rep ? (e.rep[0] === e.rep[1] ? e.rep[0] : e.rep[0] + '–' + e.rep[1]) : null;
  if(e.kind === 'time') return e.sets + ' × hold' + (e.seed && e.seed.seconds ? ' (start ~' + e.seed.seconds + ' s)' : '');
  if(e.kind === 'distance') return e.sets + ' × ' + (e.dist || '?') + ' m';
  return e.sets + ' × ' + (r ?? '?') + (e.rir != null ? ' · RIR ' + e.rir : '');
}

/* An edit opened by the v4 page carries no origin; its current path is the
   best evidence of where it came from. */
if(S.draft){
  if(!S.draft.id) S.draft.id = newId();
  if(S.draft.editing && !S.draft.originPath){
    S.draft.originPath = E.pathOf(S.draft, dir()); S.draft.origDate = S.draft.date; S.draft.origKey = S.draft.key;
  }
}

/* ---------------------------------------------------------------- ui state */
const ui = { tab:'log', preview:null, lift:null, liftRange:'3m', allSessions:false, open:new Set(), info:new Set(), note:new Set(), sheet:null, rir:null, hist:new Set(), scrollTo:null, persist:null, undo:null, toastT:0, notice:bootNotice, finishBack:null,
  cloudStatus:null, syncBad:{ github:false, account:false }, ac:{ email:'', code:'', sent:false, busy:false, msg:'', cls:'' },
  /* friends: start page sign-in, programme load, build, pages */
  si:{ step:'welcome', email:'', code:'', busy:false, err:null, until:0 }, progLoad:null, building:null,
  page:null, pageFrom:null, pageBack:null, progOpen:new Set(), rirMore:false, libAll:false, libOpen:null, retakeArm:false, qPressed:null,
  /* the coach chat (release 2) */
  coach:{ pending:null, failed:null, waiting:null, text:'', off:false, remaining:null, loading:false, checked:false, scroll:null, delArm:false, deleting:false, delErr:false } };
/* A code asked for less than an hour ago: the start page opens on the code. */
if(S.signin && S.signin.email && Date.now() - (S.signin.sentAt || 0) < 3600e3) Object.assign(ui.si, { step:'code', email:S.signin.email });
else if(S.signin && S.signin.email) ui.si.email = S.signin.email;

function toast(msg, undo){
  const el = $('#toast');
  clearTimeout(ui.toastT);
  ui.undo = undo || null;
  el.innerHTML = '<span class="grow">' + esc(msg) + '</span>' + (undo ? '<button data-act="undo">Undo</button>' : '');
  el.hidden = false;
  ui.toastT = setTimeout(() => { el.hidden = true; ui.undo = null; }, undo ? 6000 : 2600);
}

/* ---------------------------------------------------------------- rest timer */
/* Vibrates once per rest, not on every tick. A hidden page cannot vibrate at
   all, which is why the screen is kept on during a session. */
const rest = { on:false, end:0, buzzed:false };
function startRest(sec){
  if(!S.settings.restOn || !sec) return;
  Object.assign(rest, { on:true, end:Date.now() + sec*1000, buzzed:false });
  paintBar();
}
function stopRest(){ rest.on = false; paintBar(); }
function paintBar(){
  const t = $('#barT'), p = $('#plus30'), sr = document.getElementById('shRest');
  if(!S.draft || $('#bar').hidden){ if(sr) sr.textContent = ''; return; }
  if(rest.on){
    const left = Math.round((rest.end - Date.now()) / 1000);
    if(left <= 0 && !rest.buzzed){ rest.buzzed = true; try{ navigator.vibrate && navigator.vibrate([120, 80, 120]); }catch(e){} }
    if(left < -180){ rest.on = false; return paintBar(); }
    t.innerHTML = (left < 0 ? '+' : '') + mmss(left) + '<small>' + (left <= 0 ? 'rest over' : 'rest') + '</small>';
    t.classList.toggle('over', left <= 0);
    p.hidden = false;
    /* The set sheet covers the bar, so it carries its own copy of the timer. */
    if(sr){ sr.textContent = (left <= 0 ? 'rest over +' : 'rest ') + mmss(left); sr.classList.toggle('over', left <= 0); }
  } else {
    if(sr) sr.textContent = '';
    const since = (Date.now() - Date.parse(S.draft.startedAt)) / 1000;
    t.innerHTML = S.draft.editing ? 'Edit<small>saved session</small>'
      : (since >= 0 && since < 12*3600 ? mmss(since) : '–') + '<small>session</small>';

/* ---------------------------------------------------------------- wake lock */
/* The screen stays on while a session is open, so the rest timer is visible
   and can vibrate. Re-requested whenever the page comes back. */
let wake = null, wakeBusy = false;
async function syncWake(){
  const want = !!S.draft && S.settings.wakeLock !== false && document.visibilityState === 'visible' && ('wakeLock' in navigator);
  if(want && !wake && !wakeBusy){
    wakeBusy = true;
    try{
      wake = await navigator.wakeLock.request('screen');
      if(wake && wake.addEventListener) wake.addEventListener('release', () => { wake = null; });
    }catch(e){ wake = null; }
    wakeBusy = false;
  } else if(!want && wake && document.visibilityState === 'visible') releaseWake();
}
function releaseWake(){ const w = wake; wake = null; try{ w && w.release && w.release(); }catch(e){} }

/* ---------------------------------------------------------------- lift page */
function liftChartSVG(pts){
  const W = 340, H = 190, L = 36, R = 12, T = 12, B = 24;
  if(pts.length < 2) return '<div class="sub" style="padding:24px 4px">Two sessions in this range are needed for a line.</div>';
  const ys = pts.map(p => p.v), raw = Math.max(...ys) - Math.min(...ys) || 5;
  const step = [1, 2, 2.5, 5, 10, 20, 25, 50].find(s => raw / s <= 4) || 100;
  const lo = Math.floor(Math.min(...ys) / step) * step, hi = Math.ceil(Math.max(...ys) / step) * step || lo + step;
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date), span = t1 - t0 || 1;
  const x = p => (L + (Date.parse(p.date) - t0) * (W - L - R) / span).toFixed(1), y = v => (T + (hi - v) * (H - T - B) / (hi - lo || 1)).toFixed(1);
  let g = '';
  for(let v = lo; v <= hi + 1e-9; v += step) g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (+y(v) + 4) + '" text-anchor="end">' + fmtKg(v) + '</text>';
  const lab = [pts[0], pts[pts.length - 1]];
  g += lab.map((p, i) => '<text class="ax" x="' + x(p) + '" y="' + (H - 6) + '" text-anchor="' + (i ? 'end' : 'start') + '">' + esc(E.niceDate(p.date).slice(4)) + '</text>').join('');
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p) + ' ' + y(p.v)).join(' ');
  g += '<path class="fill" d="' + d + ' L' + x(pts[pts.length - 1]) + ' ' + y(lo) + ' L' + x(pts[0]) + ' ' + y(lo) + ' Z"/><path class="ln" d="' + d + '"/>';
  g += pts.map(p => '<circle class="' + (p.pr ? 'prdot' : 'dot') + '" cx="' + x(p) + '" cy="' + y(p.v) + '" r="' + (p.pr ? 4.5 : 3) + '"><title>' + esc(E.niceDate(p.date)) + ': ' + fmtKg(p.v) + ' (' + fmtKg(p.kg) + ' × ' + p.reps + ')</title></circle>').join('');
  return '<svg class="lchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Estimated max over time">' + g + '</svg>';
}
function viewLift(base){

    + (pts.length > 1 ? '<span class="lch ' + (ch > 0 ? 'up' : '') + '">' + (ch > 0 ? '▲ ' : ch < 0 ? '▼ ' : '') + fmtKg(Math.abs(ch)) + ' since ' + esc(E.niceDate(first.date).slice(4)) + '</span>' : '') + '</div>'
    + liftChartSVG(pts)

    + '<div class="hint">Gold dots are new bests. Estimated from your best set each session: kg × (1 + (reps + reps in reserve) ÷ 30).</div></div>';
  const recs = PG.repRecords(merged(), base);
  if(recs.length) h += '<div class="card"><h3>Best at each rep count</h3><table class="rect"><tr><th>Reps</th><th>Best</th><th>Date</th></tr>'
    + recs.map(r => '<tr><td>' + r.reps + '</td><td>' + fmtKg(r.kg) + ' kg</td><td>' + esc(E.niceDate(r.date)) + '</td></tr>').join('') + '</table></div>';
  h += '<div class="card"><h3>Recent sessions</h3>' + all.slice(-6).reverse().map(p => '<div class="rrow"><span>' + esc(E.niceDate(p.date)) + '</span><span>' + fmtKg(p.kg) + ' × ' + p.reps + '</span><b>' + fmtKg(p.v) + (p.pr ? ' <span class="prb">Best</span>' : '') + '</b></div>').join('') + '</div>';
  h += '<div class="center"><a class="formlink" href="' + esc(formVideo(base)) + '" target="_blank" rel="noopener">▶ Watch form on YouTube</a></div>';
  return h;
}

/* Dan's Log (declutter, 5-16): the week card, Start on two lines, a phase

/* A friend's Log: the next day in rotation, the week against perWeek, the
   other days (UX R1 §2 day one and §3; spec Q2: no set days). */
function progPicker(aH){
  const p = P(), list = merged(), w = E.programmeWeek(p, list, today());
  const day = E.programmeDay(p, w.next);
  const deload = E.deloadCheck(aH, S.bw, S.settings, today(), p).fire;

  let h = weekCardHTML(w.done, w.target, false) + '<button class="big' + (full ? '' : ' primary') + '" data-act="start" data-key="' + esc(w.next) + '">'
    + (full ? 'Start another session' : 'Start today’s session') + '<span class="lines2">' + esc(day.name) + ' · ' + day.ex.length + ' exercises' + (deload ? ' · deload' : '') + '</span></button>';

    + rest.map(d => '<button class="rowbtn" data-act="start" data-key="' + esc(E.programmeKey(d)) + '"><span class="grow"><b>' + esc(d.name) + '</b><br><span class="sub">' + d.ex.length + ' exercises</span></span></button>').join('');
  return h;
}
/* "2 of 3 this week" and the last four weeks. Weeks before the programme
   are not drawn, so they never read as missed. No red, no streaks. */
function onTrack(p, list, w){
  const n = w.target, wk = E.weekOf(today());
  const lifts = list.filter(s => !s.deleted && E.isLiftKey(s.key));
  const firstGen = lifts.filter(s => s.programmeId).map(s => s.date).sort()[0];
  const startWk = E.weekOf([p.createdAt ? p.createdAt.slice(0, 10) : today(), firstGen || '9999'].sort()[0]);
  const weeks = [-3, -2, -1, 0].map(k => E.addDays(wk, 7 * k)).filter(x => x >= startWk);
  const count = x => lifts.filter(s => E.weekOf(s.date) === x).length;
  const last = weeks.length > 1 ? count(weeks[weeks.length - 2]) : null;
  let line2 = '';
  if(w.done >= n) line2 = 'Week done. Next week starts Monday.';
  else if(weeks.length === 1 && !w.done) line2 = 'Your first week';
  else if(last === 0 && !w.done) line2 = 'Missed last week. Just start today’s session.';
  const strip = weeks.map(x => {
    const c = count(x), cur = x === wk;
    return '<div class="wk' + (cur ? ' cur' : '') + '"><div class="segs">' + Array.from({ length:n }, (_, i) => '<span class="seg' + (i < c ? ' on' : cur ? ' todo' : '') + '"></span>').join('') + '</div>'
      + '<small>' + (cur ? 'This week' : esc(E.niceDate(x).slice(4))) + '</small></div>';
  }).join('');
  return '<div class="card"><div style="font-weight:650' + (w.done >= n ? ';color:var(--ok)' : '') + '">' + w.done + ' of ' + n + ' this week' + (w.done >= n ? ' ✓' : '') + '</div>'
    + (line2 ? '<div class="sub">' + esc(line2) + '</div>' : '') + '<div class="strip" aria-hidden="true">' + strip + '</div>' + askWeekLink(w.done) + '</div>';
}

function targetLine(ex){
  const w = ex.sets.filter(s => !s.warmup);
  const pl = w.find(s => s.state === 'planned' && s.target) || w.find(s => s.target);
  const parts = [];
  if(ex.cal && pl && pl.target.kg == null) parts.push(ex.cal === 'ramp' ? 'Ramp to one top set of ' + pl.target.reps + ' · no kg target' : 'Test: ' + pl.target.reps + ' rep' + (pl.target.reps === 1 ? '' : 's') + ' · no kg target');
  else if(pl) parts.push('Target ' + E.setText(ex, { state:'planned', target:pl.target }) + (pl.target.src === 'seed' ? ' (first time)' : ''));
  else if(ex.rep) parts.push((w.length || ex.targetSets) + ' × ' + (ex.rep[0] === ex.rep[1] ? ex.rep[0] : ex.rep[0] + '–' + ex.rep[1]));
  if(ex.tplRir != null) parts.push('RIR ' + ex.tplRir);
  if(ex.rest) parts.push('rest ' + mmss(ex.rest));
  if(ex.rec) parts.push(ex.rec.rule);
  return parts.join(' · ');
}

/* A YouTube search rather than one fixed video: it works for every exercise,
   swaps included, and never goes dead. */
function formVideo(name){
  const q = name.replace(/\(superset\)/i, '').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q + ' exercise form tutorial');
}

function exCard(ex, i, cur, aH){
  const w = ex.sets.filter(s => !s.warmup);
  const planned = w.filter(s => s.state === 'planned').length;
  const complete = w.length > 0 && planned === 0;
  const expanded = ui.open.has(i) || (i === cur && !complete);
  if(!expanded){
    const doneN = w.length - planned;
    const right = complete ? esc(E.compact(ex)) + ' ✓' : doneN + '/' + w.length;
    return '<div class="card collapsed" id="ex-' + i + '"><button class="exline' + (complete ? ' ok' : '') + '" data-act="expand" data-i="' + i + '"><b>' + esc(ex.n) + '</b><span class="cs">' + right + '</span></button></div>';
  }
  let h = '<div class="card" id="ex-' + i + '"><div class="exhead"><h3>' + esc(ex.n) + '</h3>'
    + '<button class="ib" data-act="info" data-i="' + i + '" aria-label="Details">ⓘ</button>'
    + '<button class="ib" data-act="exmenu" data-i="' + i + '" aria-label="Exercise menu">⋯</button></div>'
    + '<div class="tline">' + esc(targetLine(ex)) + '</div>';
  if(ui.info.has(i)){
    const prev = E.lastFor(ex.n, aH, S.draft.date);
    const top = ex.sets.filter(s => !s.warmup).map(s => s.state === 'planned' ? (s.target && s.target.kg) : s.kg).filter(v => v != null);
    const topKg = top.length ? Math.max(...top) : null;
    const pb = ex.bar ? E.plateBreak(topKg, ex.bar) : null;
    const gen = genSession(S.draft), lx = gen ? libByName.get(ex.n) : null;
    h += '<div class="info">'
      + (gen && ex.tplRir != null ? '<p><b>' + esc(rirLine(ex.tplRir)) + '</b></p>' : '')
      + (gen ? (lx && lx.form ? (online() ? '<a class="btn w100 row" style="text-decoration:none;color:inherit" href="' + esc(lx.form) + '" target="_blank" rel="noopener"><span class="grow">▶ Watch form</span><span class="sub">YouTube ↗</span></a>'
          : '<button class="btn w100" disabled>▶ Watch form · needs internet</button>') : '') : '')
      + (ex.tplNote ? '<p>' + esc(ex.tplNote) + '</p>' : '')
      + (ex.substitutedFor ? '<p>Swapped in for <b>' + esc(ex.substitutedFor) + '</b></p>' : '')
      + (prev ? '<p>Last (' + esc(E.niceDate(prev.date)) + '): <b>' + esc(E.summarise(prev.ex)) + '</b></p>'
        : ex.sets.some(s => s.target && s.target.src === 'seed') ? '<p>No previous data. The target is a starting point (bodyweight, or the programme’s number): change it if it is wrong.</p>'
        : '<p>No previous data: nothing to progress from yet.</p>')
      + (ex.rec ? '<p><span class="pill">' + esc(ex.rec.rule) + '</span>' + esc(ex.rec.why) + '</p>' : '')
      + (pb ? '<p>' + topKg + ' kg = <b>' + esc(pb) + '</b></p>' : '')
      + (gen && lx ? '' : '<p><a class="formlink" href="' + esc(formVideo(ex.n)) + '" target="_blank" rel="noopener">▶ Watch form on YouTube</a></p>')
      + '</div>';
  }
  /* The note sits on the card, not inside ⓘ, so it can be written mid-session. */
  if(ui.note.has(i))
    h += '<input class="exnote" data-f="exnote" data-i="' + i + '" value="' + esc(ex.note || '') + '" placeholder="Note: cues, pain, variation, how it felt">';
  else if(ex.note)
    h += '<button class="exnote shown" data-act="noteOpen" data-i="' + i + '">✎ ' + esc(ex.note) + '</button>';
  /* Each working set shows last session's matching set in grey, and a PR
     badge when a ticked set beats every earlier estimated max of this lift. */
  const prevEx = E.lastFor(ex.n, aH, S.draft.date), prevW = prevEx ? E.working(prevEx.ex) : [];
  let bestV = 0;
  if(ex.kind === 'weight' && E.loadOf(ex) !== 'bw'){
    const before = PG.liftSeries(merged().filter(s => s.date < S.draft.date), PG.baseName(ex.n), E.e1rm);
    bestV = before.length ? Math.max(...before.map(p => p.v)) : 0;
  }
  let wn = 0;
  ex.sets.forEach((st, j) => {
    const done = st.state !== 'planned', legacy = st.state === 'legacy';
    const n = st.warmup ? 'W' : String(++wn);
    const ps = st.warmup ? null : prevW[wn - 1];
    const last = ps ? '<small class="lastv">last ' + esc(E.setText(ex, { ...ps, state:'done' })) + '</small>' : '';
    const v = done && !st.warmup && st.kg > 0 && st.reps ? E.e1rm(st.kg, st.reps, st.rir ?? 0) : null;
    const pr = bestV > 0 && v && v > bestV + 0.05 ? '<span class="prb">PR</span>' : '';
    h += '<div class="setrow' + (done ? ' done' : '') + (legacy ? ' legacy' : '') + (st.warmup ? ' warm' : '') + '"><span class="sn">' + n + '</span>'
      + '<button class="val" data-act="sheet" data-i="' + i + '" data-j="' + j + '">' + esc(E.setText(ex, st)) + pr + last + '</button>'
      + '<button class="tick" data-act="tick" data-i="' + i + '" data-j="' + j + '" aria-label="' + (legacy ? 'Saved set: tap to edit' : done ? 'Untick' : 'Done as shown') + '">✓</button></div>';
  });
  const foot = [];
  const started = w.some(s => s.state !== 'planned');
  if(!started && ex.kind === 'weight' && E.loadOf(ex) === 'kg' && ex.sets.filter(s => s.warmup).length < 3)
    foot.push('<button data-act="warm" data-i="' + i + '">+ Warm-up</button>');
  if(planned) foot.push('<button data-act="bulk" data-i="' + i + '">All as shown ✓</button>');
  if(!ex.note && !ui.note.has(i)) foot.push('<button data-act="noteOpen" data-i="' + i + '">+ Note</button>');
  if(ui.open.has(i) && i !== cur) foot.push('<button data-act="collapse" data-i="' + i + '">Hide</button>');
  if(foot.length) h += '<div class="exfoot">' + foot.join('') + '</div>';
  return h + '</div>';
}

/* The most frequent tap in a session, the next set's ✓, lives in the bottom
   bar where the thumb already is. It always targets the first planned set of
   the exercise in hand (warm-ups first), and opens the sheet when that set
   has nothing to copy. */
function nextSet(){

  const i = currentIdx(d);
  if(i == null) return null;
  const ex = d.exercises[i], j = ex.sets.findIndex(s => s.state === 'planned');

}

/* ---------------------------------------------------------------- sheets */
function renderSheet(){
  const el = $('#sheet');

  if(s.type === 'set') body = setSheet(s);

/* ---- add exercise: what you have done before first, then the programme's
   exercises, then the library. Typing a name nobody has adds it as new. */
const TPL_KEYS = ['kind', 'load', 'inc', 'rep', 'rir', 'rest', 'bar', 'note', 'seed', 'hold', 'dist'];
function exerciseCatalogue(){
  const out = new Map();
  const add = (n, src, tpl) => { const k = n.toLowerCase(); if(!out.has(k)) out.set(k, { n, src, tpl }); else if(tpl && !out.get(k).tpl) out.get(k).tpl = tpl; };
  const pick = e => { const t = {}; for(const k of TPL_KEYS) if(e[k] != null) t[k] = e[k]; return t; };
  for(const h of S.history) if(!h.deleted) for(const e of h.exercises || []) if(e && e.n) add(e.n, 'Done before', null);
  const p = P();
  for(const d of p ? p.days : Object.values(E.TEMPLATES).filter(t => !t.legacy)) for(const e of d.ex) add(e.n, 'In your programme', pick(e));
  for(const e of L.EXERCISES) add(e.n, (L.PATTERNS[e.pattern] || {}).label || 'Library', pick(e));
  for(const e of EXDB || []) add(e.n, dbLabel(e), dbTpl(e));
  return [...out.values()];
}
/* 5-21: the open exercise database (data/exercises.json, ~880 exercises from
   free-exercise-db, public domain). Loaded on first use; the service worker
   keeps a copy for offline. */
let EXDB = null, exdbLoading = null;
function loadExDb(){
  if(EXDB) return Promise.resolve(EXDB);
  if(!exdbLoading) exdbLoading = fetch('data/exercises.json?v=1').then(r => r.json()).then(j => (EXDB = Array.isArray(j.exercises) ? j.exercises : []))
    .catch(() => { exdbLoading = null; return []; });
  return exdbLoading;
}
const ucFirst = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const dbLabel = e => [ucFirst(e.e === 'body only' ? 'bodyweight' : e.e), e.m].filter(Boolean).join(' · ');
const dbTpl = e => ({ kind: e.c === 'stretching' || e.c === 'cardio' ? 'time' : 'weight', ...(e.e === 'body only' && e.c !== 'stretching' ? { load:'bw' } : {}), note: (e.i || []).slice(0, 2).join(' ') });
function addExList(q){
  const all = exerciseCatalogue(), t = q.trim().toLowerCase();
  const hits = t ? all.filter(x => x.n.toLowerCase().includes(t)) : all;
  let h = hits.slice(0, 60).map(x => '<button class="rowbtn" data-act="addpick" data-n="' + esc(x.n) + '"><span class="grow"><b>' + esc(x.n) + '</b><br><span class="sub">' + esc(x.src) + '</span></span></button>').join('');
  if(t && !all.some(x => x.n.toLowerCase() === t))
    h = '<button class="rowbtn" data-act="addpick" data-n="' + esc(q.trim()) + '"><span class="grow"><b>+ Add “' + esc(q.trim()) + '”</b><br><span class="sub">New exercise, logged as weight × reps</span></span></button>' + h;
  return h || '<div class="empty">No exercises match.</div>';
}
function addExSheet(s){
  return '<div class="sh-h"><span class="grow">Add exercise</span><button class="ib" data-act="closeSheet" aria-label="Close">×</button></div>'
    + '<input type="search" data-f="addq" value="' + esc(s.q || '') + '" placeholder="Search, or type a new name" autocomplete="off">'
    + '<div id="addList" style="margin-top:10px">' + addExList(s.q || '') + '</div>';
}

function stepRow(label, key, val, step){
  return '<label>' + esc(label) + '</label><div class="step">'
    + '<button data-act="shstep" data-k="' + key + '" data-d="' + (-step) + '" aria-label="Less">−</button>'
    + '<input type="text" inputmode="decimal" autocomplete="off" data-f="shval" data-k="' + key + '" value="' + esc(val ?? '') + '">'
    + '<button data-act="shstep" data-k="' + key + '" data-d="' + step + '" aria-label="More">+</button></div>';
}
function bandList(cur){
  const bands = (S.settings.bands && S.settings.bands.length ? S.settings.bands : E.DEFAULT_BANDS).slice();
  for(const b of String(cur || '').split('+').filter(Boolean)) if(!bands.includes(b)) bands.push(b);
  return bands;
}
function setSheet(s){
  const ex = S.draft.exercises[s.i], st = ex.sets[s.j], v = s.v, load = E.loadOf(ex);
  const n = st.warmup ? 'warm-up' : 'set ' + (ex.sets.filter((x, k) => !x.warmup && k <= s.j).length);
  let h = '<div class="sh-h"><span class="grow">' + esc(ex.n) + ' · ' + n + '</span><span class="shrest" id="shRest"></span></div>';
  if(ex.kind === 'weight' && load !== 'bw') h += stepRow(load === 'bw+' ? 'Added kg (0 = bodyweight)' : 'kg', 'kg', v.kg, ex.inc || 2.5);
  if(ex.kind === 'band'){
    const on = String(v.band || '').split('+');
    h += '<label>Band (tap every band used)</label><div class="chips small">' + bandList(v.band).map(b =>
      '<button class="chip' + (on.includes(b) ? ' on' : '') + '" data-act="shband" data-b="' + esc(b) + '">' + esc(b) + '</button>').join('') + '</div>';
  }

  if(ex.kind === 'weight' || ex.kind === 'band' || ex.kind === 'reps') h += stepRow(ex.kind === 'reps' && /cm/.test(ex.n) ? 'cm' : 'reps', 'reps', v.reps, 1);
  if(ex.kind === 'weight' || ex.kind === 'band'){
    const vals = [0, 1, 2, 3, 4];
    if(v.rir != null && !vals.includes(v.rir)) vals.push(v.rir);

      + (gen ? '<div class="hint">0 = none left · 2 = could do 2 more · 4+ = easy</div>' : '');
  }

    + '<button class="toggle' + (v.warmup ? ' on' : '') + '" data-act="shwarm">' + (v.warmup ? 'Warm-up ✓' : 'Warm-up') + '</button>'
    + '<button class="textbtn" data-act="shdel">' + (s.delArm && Date.now() - s.delArm < 3000 ? 'Tap again to delete' : 'Delete set') + '</button></div>'
    + '<button class="save56" data-act="shsave">Save ✓</button>';

}

/* The finish sheet: nothing is written until Save. */
function finishSheet(s){
  const d = S.draft, aH = aHist();
  const res = E.finishSession(d, nowIso(), s.choice || undefined);
  const work = d.exercises.flatMap(ex => ex.sets.filter(st => !st.warmup && (st.state === 'planned' || E.hasData(st))));
  const ticked = work.filter(st => st.state !== 'planned').length;
  const plannedN = work.length - ticked;
  let h = '<div class="sh-h"><button class="ib" data-act="closeSheet" aria-label="Back">←</button><span class="grow">Finish ' + esc(d.name) + '</span></div>';
  h += '<div class="fsec" style="border-top:none">' + esc(E.niceDate(d.date, true))
    + ' · <button class="textbtn plain" data-act="fDate">change</button>'
    + (s.dateOpen ? '<input type="date" data-f="findate" value="' + esc(d.date) + '" max="' + today() + '">' : '') + '</div>';

  h += '<div class="fsec"><h4>' + ticked + ' of ' + work.length + ' working sets ticked</h4>';
  const noRir = [];
  for(const ex of d.exercises){
    const c = E.compact(ex);
    const r = E.rirRef(ex);
    const prev = E.lastFor(ex.n, aH, d.date);
    if(c && (ex.kind === 'weight' || ex.kind === 'band') && r == null) noRir.push(d.exercises.indexOf(ex));
    h += '<div class="sumline"><b>' + esc(ex.n) + '</b> ' + (c ? esc(c.replace(/ @[\d.]+$/, '')) : '<span class="sub">not done</span>')
      + (c && r != null ? (ex.backoff ? ' · top-set RIR ' : ' · last-set RIR ') + r : '')
      + (prev ? ' <span class="sub">· last time ' + esc(E.compact(prev.ex)) + '</span>' : '') + '</div>';
  }
  /* Each opens the reps-left chips for that exercise's last set; one tap on a
     chip rates it and comes straight back here. */
  if(noRir.length) h += '<div class="hint">' + (genSession(d)
      ? 'These have no answer for “how many more reps” on the last set, so Liftless can’t choose next time’s weight. Tap to answer:'
      : 'No RIR on the set that drives progression (the last set, or the top set on a heavy lift), so these cannot progress. Tap to rate:') + '</div><div class="chips small" style="margin-top:6px">'
    + noRir.map(i => '<button class="chip" data-act="rateLast" data-i="' + i + '">' + esc(d.exercises[i].n) + '</button>').join('') + '</div>';
  h += '</div>';

  if(plannedN){
    const stuck = res.blocked === 'unticked' && s.choice === 'asShown' ? res.noTarget : 0;
    h += '<div class="fsec"><div class="warnbox"><b>' + plannedN + ' set' + (plannedN > 1 ? 's' : '') + ' not ticked.</b>'
      + '<div class="row"><button class="btn' + (s.choice === 'asShown' ? ' on' : '') + '" data-act="fChoice" data-v="asShown">I did them as shown</button>'
      + '<button class="btn' + (s.choice === 'drop' ? ' on' : '') + '" data-act="fChoice" data-v="drop">I didn’t do them</button></div>'
      + (stuck ? '<div class="hint">' + stuck + ' of them have no target to copy. Go back and enter them, or choose “I didn’t do them”.</div>' : '')
      + '</div></div>';
  }

  h += '<div class="fsec"><h4>Session RPE <span class="sub">(whole session, optional)</span></h4><div class="chips">'
    + [5, 6, 7, 8, 9, 10].map(v => '<button class="chip s48' + (d.sessionRpe === v ? ' on' : '') + '" data-act="fRpe" data-v="' + v + '">' + v + '</button>').join('') + '</div></div>';

  const sy = Array.isArray(d.symptoms) ? d.symptoms : null;
  const lb = sy && sy.find(x => x.area === 'low-back');
  const other = sy && sy.find(x => x.area === 'other');
  const lower = d.key === 'lower-a' || d.key === 'lower-b';
  h += '<div class="fsec' + (lower ? ' hl' : '') + '"><h4>Anything flare up?</h4><div class="chips">'
    + '<button class="chip' + (sy && !sy.length ? ' on' : '') + '" data-act="fSym" data-v="none">None</button>'
    + '<button class="chip' + (lb ? ' on' : '') + '" data-act="fSym" data-v="low-back">Low back</button>'
    + '<button class="chip' + (other ? ' on' : '') + '" data-act="fSym" data-v="other">Other</button></div>';
  if(lb){
    h += '<div class="chips" style="margin-top:8px">'
      + '<button class="chip' + (lb.type === 'tight' ? ' on' : '') + '" data-act="fLbType" data-v="tight">Tight</button>'
      + '<button class="chip' + (lb.type === 'pinch' ? ' on' : '') + '" data-act="fLbType" data-v="pinch">One-sided pinch</button></div>';
    if(lb.type === 'pinch'){
      h += '<div class="chips" style="margin-top:8px">'
        + ['L', 'R'].map(v => '<button class="chip' + (lb.side === v ? ' on' : '') + '" data-act="fLbSide" data-v="' + v + '">' + v + '</button>').join('') + '</div>'
        + '<div class="pinch">' + pinchText(E.pinchCount(S.settings.priorPinches, aH)) + '</div>';
    }
  }
  h += '</div>';

  h += '<div class="fsec">' + (s.noteOpen || d.notes
    ? '<h4>Note</h4><textarea data-f="notes" placeholder="Energy, sleep, anything the trainer should know">' + esc(d.notes) + '</textarea>'
    : '<button class="textbtn plain" data-act="fNote">Add note</button>') + '</div>';

  const blocked = !!res.blocked;
  const why = res.blocked === 'empty' ? 'Nothing performed and no note: nothing to save.' : res.blocked === 'unticked' && !s.choice ? 'Choose what happened to the unticked sets.' : '';
  h += '<button class="save56" data-act="saveSession"' + (blocked ? ' disabled' : '') + '>Save session</button>'
    + (why ? '<div class="hint center">' + esc(why) + '</div>' : '')
    + '<div class="center"><button class="textbtn plain" data-act="closeSheet">Back</button></div>';
  return h;
}

/* The build is read from this page's own module imports (engine.js?v=…), so it
   can never disagree with what is actually running. The Android app carries
   its own copy and only changes when a new .apk is installed. */
const BUILD = ((document.querySelector('script[type="module"]') || {}).textContent || '').match(/engine\.js\?v=([\w-]+)/)?.[1] || '?';
const WHERE = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? 'Android app' : 'website';

/* ---------------------------------------------------------------- health (5-22)
   Health Connect on Android (Google Health / Fitbit write there), read by the
   Capacitor plugin inside the Android app. Daily rows are kept on the phone
   and in the account; the website shows what the account holds. */
const HEALTH_TYPES = ['sleep', 'restingHeartRate', 'heartRateVariability', 'steps', 'weight'];
const healthPlugin = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Health) || null;
const tzName = () => { try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Prague'; }catch(e){ return 'Europe/Prague'; } };
const hState = () => (S.health ||= { connected:false, lastSync:null, rows:[] });
function mergeHealth(rows){
  const st = hState(), by = new Map(st.rows.map(r => [r.day, r]));
  for(const r of rows) by.set(r.day, { ...(by.get(r.day) || {}), ...Object.fromEntries(Object.entries(r).filter(([, v]) => v != null)) });
  const cut = E.addDays(today(), -60);
  st.rows = [...by.values()].filter(r => r.day >= cut).sort((a, b) => a.day.localeCompare(b.day));
}
let healthBusy = null;
function healthSync(force){
  if(healthBusy) return healthBusy;
  /* The promise is stored before it can settle: a sync with nothing to do
     finishes at once, and clearing the guard inside it would leave the guard
     stuck on a settled promise. */
  const p = (async () => {
    const st = hState(), hp = healthPlugin();
    try{
      if(hp && st.connected && (force || !st.lastSync || Date.now() - Date.parse(st.lastSync) > 30 * 60e3)){
        const days = st.lastSync ? 4 : 30, end = new Date(), start = new Date(Date.now() - days * 864e5);
        const q = t => hp.readSamples({ dataType:t, startDate:start.toISOString(), endDate:end.toISOString(), limit:2000 }).then(r => r.samples || [], () => []);
        const [sleep, restingHeartRate, heartRateVariability, weight] = await Promise.all([q('sleep'), q('restingHeartRate'), q('heartRateVariability'), q('weight')]);
        const steps = await hp.queryAggregated({ dataType:'steps', startDate:start.toISOString(), endDate:end.toISOString(), bucket:'day', aggregation:'sum' }).then(r => r.samples || [], () => []);
        const rows = HL.dailyRows({ sleep, restingHeartRate, heartRateVariability, steps, weight }, tzName());
        /* What each type returned, and what Health Connect granted: shown on the
           Health card so a missing type can be traced to the source app or to access. */
        const granted = await hp.checkAuthorization({ read: HEALTH_TYPES }).then(a => a && a.readAuthorized || [], () => null);
        st.diag = { at: new Date().toISOString(), granted, counts: { sleep: sleep.length, restingHeartRate: restingHeartRate.length, heartRateVariability: heartRateVariability.length, steps: steps.length, weight: weight.length } };
        mergeHealth(rows); st.lastSync = new Date().toISOString(); st.err = null; save();
        if(cloud.signedIn() && !cloud.foreign() && rows.length) await cloud.pushHealth(rows).catch(() => {});
      } else if(!hp && cloud.signedIn() && !cloud.foreign()){
        mergeHealth(await cloud.pullHealth(E.addDays(today(), -40))); save();
      }
    }catch(e){ st.err = 'Could not read health data. Open Health Connect and check Liftless has access.'; }
  })();
  healthBusy = p;
  p.finally(() => { if(healthBusy === p) healthBusy = null; });
  return p;
}
async function healthConnect(){
  const hp = healthPlugin(), st = hState();
  if(!hp) return;
  try{
    const a = await hp.isAvailable();
    if(!a || !a.available){ st.err = 'Health Connect is not available on this phone' + (a && a.reason ? ' (' + a.reason + ')' : '') + '. On Android 13 or older, install Health Connect from the Play Store.'; render(); return; }
    await hp.requestAuthorization({ read: HEALTH_TYPES });
    const ok = await hp.checkAuthorization({ read: HEALTH_TYPES });
    st.connected = !!(ok && ok.readAuthorized && ok.readAuthorized.length);
    st.err = st.connected ? null : 'No access was given. Tap Connect again and allow sleep and heart rate.';
    save(); render();
    if(st.connected){ await healthSync(true); render(); toast('Health connected'); }
  }catch(e){ st.err = 'Could not open Health Connect. Try again.'; render(); }
}
function healthCard(){
  const hp = healthPlugin(), st = hState(), rec = HL.recovery(st.rows, today(), E.addDays);
  let h = '<div class="card"><h3>Health</h3>';
  if(!hp && !st.rows.length) return h + '<div class="sub">Sleep and resting heart rate from your watch (Fitbit / Google Health) come in through the Liftless Android app. iPhone is not supported yet.</div></div>';
  if(hp && !st.connected) h += '<div class="sub">Read sleep, resting heart rate, HRV, steps and weight from Health Connect. Liftless only reads; it never writes to your health data. The coach uses it to tell you when to go easier.</div>'
    + '<button class="btn primary w100" style="margin-top:10px" data-act="healthConnect">Connect Health Connect</button>';
  if(st.rows.length) h += '<div class="sub" style="margin-top:6px">Last night <b>' + HL.hm(rec.lastNight) + '</b> · resting HR <b>' + (rec.rhr7 ?? '—') + '</b>' + (rec.rhrUsual != null ? ' (usual ' + rec.rhrUsual + ')' : '') + (rec.hrv7 != null ? ' · HRV <b>' + rec.hrv7 + ' ms</b>' : '') + '</div>';

    + '<button class="textbtn plain" data-act="healthSettings">Manage access in Health Connect</button>';
  if(hp && st.connected && st.diag){
    const names = { sleep:'Sleep', restingHeartRate:'Resting heart rate', heartRateVariability:'HRV', steps:'Steps', weight:'Weight' };
    const g = st.diag.granted;
    h += '<div class="hdiag">' + HEALTH_TYPES.map(t => {
      const n = st.diag.counts[t] || 0, allowed = !g || g.includes(t);
      const state = n ? '<span class="ok">✓ ' + n + '</span>' : !allowed ? '<span class="bad">no access</span>' : '<span class="warn">nothing received</span>';
      return '<div><span>' + names[t] + '</span>' + state + '</div>';
    }).join('') + '</div>';
    const noAccess = HEALTH_TYPES.filter(t => g && !g.includes(t)), none = HEALTH_TYPES.filter(t => (!g || g.includes(t)) && !st.diag.counts[t]);
    if(noAccess.length) h += '<div class="hint">No access to ' + esc(noAccess.map(t => names[t].toLowerCase()).join(', ') + '. Tap Manage access below and allow them.') + '</div>';
    if(none.length) h += '<div class="hint">Nothing received for ' + esc(none.map(t => names[t].toLowerCase()).join(', ')) + '. In the Google Health app: Settings → Health Connect, turn sharing on for them, then tap Sync now.</div>';
  }
  if(st.err) h += '<div class="hint" style="color:var(--bad)">' + esc(st.err) + '</div>';
  return h + '<div class="hint"><a class="formlink" href="privacy.html" target="_blank" rel="noopener">How Liftless uses health data</a></div></div>';
}

/* You → How your programme works (5-22): the plan, then the rules the engine
   uses after every session, in plain words. Wording follows engine.js. */
function viewHow(){
  const p = P(), b = E.blockInfo(today());
  let h = '<div class="card"><h3>Your plan</h3>';
  if(p){
    const a = p.answers || {};
    h += '<p class="sub">Built from your five answers: ' + esc([a.days ? a.days + ' days a week' : '', a.place ? 'training at ' + a.place : '', a.level ? 'experience: ' + a.level : '', a.minutes ? a.minutes + ' minutes a session' : ''].filter(Boolean).join(', ')) + '.</p>'
      + '<p class="sub">Each day has slots by movement (squat, hinge, push, pull, single-leg, core and arms). For each slot the app picks an exercise from the library that fits your equipment, your experience and anything that hurts. Main lifts come first with more sets and fewer reps; accessories come last with more reps.</p>'
      + '<p class="sub">You can swap any exercise for another in the same slot: Your programme → Swap.</p>';
  } else {
    h += '<p class="sub">A 20-week strength block, four days a week, that started ' + esc(E.niceDate(E.BLOCK.start)) + '.' + (b ? ' You are in week <b>' + b.week + '</b>' + (b.phaseName ? ', phase <b>' + esc(b.phaseName) + '</b>' : '') + '.' : '') + '</p>'
      + '<ul class="howl">' + E.PHASES.map(ph => '<li><b>' + esc(ph.name) + '</b> (weeks ' + ph.from + '–' + ph.to + ')' + ({ Base:': learn the weights, steady sets.', Build:': one heavy top set, then two lighter back-off sets.', Intensify:': heavier and fewer reps (3×3).', Test:': find your new best, then a short rest.' }[ph.name] || '') + '</li>').join('') + '</ul>'
      + '<p class="sub">Deload weeks are 6, 12 and 18: every lift at ' + Math.round(E.DELOAD.loadPct * 100) + '% of the working weight, fewer accessory sets. They should feel easy.</p>';
  }
  h += '</div><div class="card"><h3>How the weights move</h3>'
    + '<p class="sub">After every session the app looks at each lift: your reps against the range, and how many good reps you had left on the last set (RIR, reps in reserve). The first rule that fits decides the next target.</p>'
    + '<div class="rules">' + [
      ['R1', 'Up', 'You reached the top of the rep range with reps to spare: add weight next time.'],
      ['R3', 'Same', 'Inside the range: same weight, add a rep to your weakest set.'],
      ['R2', 'Hold', 'Top of the range but nothing left in the tank: same weight until it feels easier.'],
      ['R4', 'Same', 'Two or more sets fell short of the range: same weight again.'],
      ['R5', 'Down 10%', 'Stalled twice in a row: drop 10% and build back up.'],
      ['RN', 'Same', 'No RIR on the last set: the app can’t tell how hard it was, so it keeps the weight. Rate the last set to move on.'],
      ['R0', 'Same', 'The session was cut short: repeat it.'],
      ['R6', 'Lighter', 'Deload: lighter on purpose so you recover.']
    ].map(([c, w, t]) => '<div class="rule"><span class="pill">' + c + '</span><b>' + esc(w) + '</b><span class="sub">' + esc(t) + '</span></div>').join('') + '</div>'

    + '<div class="card"><h3>When it says deload</h3><p class="sub">Apart from the planned weeks, a deload is suggested when several signs line up: estimated maxes dropping, many weeks since the last deload, or (with health data) poor sleep and a raised resting heart rate. You can always start a session as a deload from ⋯ in the session.</p></div>';
  return h;
}

    r.disabled = left > 0 || s.busy; r.textContent = left > 0 ? 'Send a new code (' + mmss(left) + ')' : 'Send a new code';
  }
  if(s.until && s.until <= Date.now()){ s.until = 0; if(s.err && s.err.wait){ s.err = null; if(screen() === 'start') render(); } }
  else if(s.until && s.err && s.err.wait){
    const b = document.querySelector('.banner.warn'); if(b) b.textContent = s.err.wait.replace('{t}', mmss((s.until - Date.now()) / 1000));
  }
}
setInterval(() => { if(screen() === 'start') tickSignin(); }, 1000);
function siError(e, onCode){
  if(e && e.offline) return { cls:'warn', msg: onCode ? 'You’re offline. Your code still works: connect, then type it.' : 'You’re offline. Connect to the internet to sign in.' };
  if(e && (e.status === 429 || /rate_limit/.test(String(e.code || '')))){
    ui.si.until = Date.now() + 60000;
    const wait = (onCode ? 'Too many tries. Wait {t}, then send a new code.' : 'Too many codes asked for. Wait {t}, then try again.');
    return { cls:'warn', wait, msg: wait.replace('{t}', '1:00') };
  }
  /* Supabase answers a wrong and an expired code the same way. */
  if(onCode && e && (e.code === 'otp_expired' || e.status === 403 || e.status === 400))
    return { cls:'bad', resend:true, msg:'That code doesn’t match or has expired. Check the latest email and type it again, or send a new code.' };
  return { cls:'bad', msg: onCode ? explain(e) : 'Couldn’t send the code. Try again in a minute.' };
}
async function siSend(force){
  const s = ui.si, email = String(s.email || '').trim();
  if(!/@.+\./.test(email) || s.busy) return;
  s.busy = true; s.err = null; render();
  try{
    await cloud.requestCode(email);
    S.signin = { email, sentAt: Date.now() }; save();
    const again = s.step === 'code';
    Object.assign(s, { step:'code', email, code:'' });
    if(again) toast('New code sent. Use the latest one.');
  }catch(e){ s.err = siError(e, s.step === 'code'); }
  s.busy = false; render();
  const c = $('[data-f="siCode"]'); if(c) c.focus();
}
/* Typed while offline: one retry when the signal is back (one listener, not
   one per attempt). A refusal after that retry first checks whether a
   sign-in did land (the first request may have reached the server). */
let siRetryArmed = false;
async function siVerify(){
  const s = ui.si, code = String(s.code || '').replace(/\D/g, '');
  if(cloud.signedIn()){ await afterSignIn({ foreign: cloud.foreign() }); return; }
  if(code.length !== 8 || s.busy) return;
  s.busy = true; s.err = null; render();
  try{
    const who = await cloud.verifyCode(s.email, code);
    s.busy = false;
    await afterSignIn(who);
  }catch(e){
    s.busy = false;
    if(e && e.offline){
      s.err = siError(e, true); render();
      if(!siRetryArmed){ siRetryArmed = true; window.addEventListener('online', () => { siRetryArmed = false; siVerify(); }, { once:true }); }
      return;
    }
    if(cloud.signedIn()){ await afterSignIn({ foreign: cloud.foreign() }); return; }
    s.code = ''; s.err = siError(e, true); render();
    const c = $('[data-f="siCode"]'); if(c) c.focus();
  }
}
/* After any sign-in (start page or Settings): Dan's GitHub phone goes back
   where it was; an account phone loads the programme, or asks the questions. */
async function afterSignIn(who){
  claimStorage(S, sync.cfgOk()); delete S.signin; save();
  ui.si = { step:'welcome', email:'', code:'', busy:false, err:null, until:0 };
  if(mode() === 'account') setSync('ok', 'signed in');

/* "Loading your programme…". A failure never falls through to the questions:
   that could overwrite a programme the person already has. */
async function loadProgramme(){
  ui.progLoad = 'loading'; render();

  catch(e){
    /* A programme that fails its checks is not a network problem: Try again
       would fail the same way, so the way out is to set it up again. */
    ui.progLoad = /^(programme|answers):/.test(String(e && e.message)) ? 'invalid' : 'error';
    render(); return;
  }
  if(P()){ ui.tab = 'log'; ui.page = null; }

/* Advances from the question answered (G.onboardAdvance): a second tap or a
   stale timer never skips a question. */
function qAdvance(from){
  const o = S.onboard; if(!o) return;
  const next = G.onboardAdvance(o, from);
  ui.qPressed = null; ui.qBusy = false;
  if(next === o) return;
  S.onboard = next; save(); try{ history.pushState({ q:next.step }, ''); }catch(e){} window.scrollTo(0, 0); render();
}
function qBack(){
  const o = S.onboard; if(!o) return;
  if(o.step === 0){ if(o.retake){ S.onboard = null; save(); ui.page = null; ui.tab = 'settings'; render(); } return; }
  o.step--; delete o.kitFor; ui.qBusy = false; ui.qPressed = null; save(); render();
}

/* The questions, opened with earlier answers marked: every answer that still
   reads is kept (an unknown pain flag drops the pain answer only). keep: an
   earlier programme whose swaps carry over where they still fit. */
function onboardFrom(answers, keep){
  const a = answers && typeof answers === 'object' ? E.clone(answers) : {};
  if(!Array.isArray(a.pain) || a.pain.some(x => !L.PAIN_FLAGS.includes(x))) delete a.pain;
  const o = { step:0, answers:a, has:E.clone(a.has || {}), painSel: Array.isArray(a.pain) ? (a.pain.length ? a.pain.slice() : ['none']) : [] };
  if(keep) o.keep = keep;
  return o;
}

/* ----------------------------------------------------------------- building */
function startBuild(){
  const o = S.onboard;
  if(!o) return;
  /* An answer missing or unreadable (a stale tap, old saved state): back to
     that question rather than an error. */
  const miss = G.firstMissing(o.answers, L);
  if(miss >= 0){ ui.building = null; o.step = miss; ui.qBusy = false; ui.qPressed = null; save(); render(); toast('Please answer this one again.'); return; }
  const lines = (() => { try{ return G.buildLines(o.answers, L); }catch(e){ return []; } })();
  ui.building = { lines, shown:0, failed:false };
  render();
  let prog = null;
  try{
    const keep = o.keep || (o.retake ? P() : null);
    prog = checkProg(G.generate(o.answers, L, { id:'gen-' + Date.now().toString(36), createdAt:nowIso(), keep }));
  }catch(e){ ui.building.failed = true; render(); return; }
  const step = () => {
    if(!ui.building) return;
    if(ui.building.shown < lines.length){ ui.building.shown++; render(); setTimeout(step, 300); return; }
    setTimeout(() => finishBuild(prog), 300);
  };
  setTimeout(step, 300);
}
function finishBuild(prog){
  const retake = !!(S.onboard && S.onboard.retake);
  cloud.setProgramme(prog).then(softRender);           // cached at once; sent when it can be
  S.onboard = null; ui.building = null; ui.progOpen.clear(); save();
  ui.page = 'programme'; ui.pageFrom = retake ? 'settings' : 'build'; ui.tab = 'log';
  window.scrollTo(0, 0); render();
  if(retake) toast('New programme saved. Your next session is ' + prog.days[0].name + '.');
}

}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

/* Today only (substitutedFor, as the prompt swap): the session exercise is
   rebuilt for the new exercise, before any of its sets is logged. */
function swapToday(s, p, id){
  const d = S.draft, old = d.exercises[s.ses], day = p.days.find(x => x.key === s.d), slot = day.ex[s.i];
  if(old.sets.some(x => !x.warmup && x.state !== 'planned')) return;
  const tpl = id === slot.lib ? slot : E.normaliseProgramme(G.swap(p, s.d, s.i, id, p.answers, L)).days.find(x => x.key === s.d).ex[s.i];
  if(tpl.n === old.n){ ui.sheet = null; render(); return; }
  const nx = E.programmeExercise(tpl, aHist(), d.date, d.isDeload);
  if(tpl.n !== slot.n) nx.substitutedFor = slot.n;
  nx.note = old.note || '';
  d.exercises[s.ses] = nx;
  ui.sheet = null; ui.open.add(s.ses); save(); render();
  toast('Swapped in ' + tpl.n + ' for today.', () => { if(S.draft === d && d.exercises[s.ses] === nx){ d.exercises[s.ses] = old; save(); render(); } });
