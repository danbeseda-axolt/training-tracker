/* The coach chat (release 2): free chat and the week review on one Edge
   Function. Spec: projects/ledger-chat-spec.md; screens and copy:
   projects/ledger-ux-chat.md. Shown only when signed in to an account (or on
   a friend's account phone whose sign-in expired, to say so). Dan's GitHub
   phone signed out sees nothing of it: no tab, no card, no button, no call. */
const coachLive = () => cloud.signedIn() && !cloud.foreign();
const coachTab = () => coachLive() || (mode() === 'account' && cloud.inUse() && !cloud.signedIn());
const coachRows = () => Array.isArray(S.chat) ? S.chat : [];
/* "Off" is checked again after a minute, and on every opening of the tab. */
const coachOff = () => C.offNow(ui.coach.off, Date.now());
const coachAccepted = () => (S.coachOk || 0) >= C.COPY_V;
const limitToday = () => S.coachLimitDay === today();
/* Sessions of this person not yet in the account (the coach can't see them). */
const myHeld = () => { const me = cloud.userId(); return cloudQ().filter(q => q && q.date && (!q._owner || q._owner === me)).length; };
/* Why an entry point is disabled, or ''. */
function coachBlocked(){
  if(!online()) return 'Needs internet.';
  if(limitToday()) return 'You’ve used today’s messages. Ask tomorrow.';
  if(ui.coach.noAccess) return 'The coach is invite-only for now.';
  if(coachOff()) return 'The coach is off for now.';
  return '';
}
/* This week's count against its target, as the Log tab counts it. */
function weekDone(){
  const p = P(), list = merged();
  if(p){ const w = E.programmeWeek(p, list, today()); return { done:w.done, target:w.target }; }
  if(friend()) return { done:0, target:0 };
  const plan = E.weekPlan(list, today());
  return { done: plan.filter(x => x.state === 'done').length, target: plan.length };
}
function mainLifts(){
  const p = P(), out = new Set();
  for(const d of p ? p.days : Object.values(E.TEMPLATES).filter(t => !t.legacy)) for(const e of d.ex) if(e.key) out.add(e.n);
  return [...out];
}
/* Suggestion 3: a session is in progress and a target is below last time. */
function lowerToday(){
  const d = S.draft; if(!d) return false;
  const aH = aHist();
  return d.exercises.some(ex => {
    const st = ex.sets.find(s => !s.warmup && s.target), prev = E.lastFor(ex.n, aH, d.date);
    if(!st || st.target.kg == null || !prev) return false;
    const top = Math.max(...E.working(prev.ex).map(s => s.kg ?? -1));
    return top >= 0 && st.target.kg < top;
  });
}
const coachSugg = () => C.suggestions({ list: merged(), today: today(), weekOf: E.weekOf, addDays: E.addDays, mainLifts: mainLifts(), lowerToday: lowerToday(), isLift: s => E.isLiftKey(s.key), week: weekDone() });

/* Sends one question. One tap = one question: every entry point that carries
   a question sends it at once and opens the Coach tab at it. A week already
   reviewed opens the stored review instead (free). Never queued offline. */
async function coachAsk(q, opts = {}){
  q = String(q || '').trim();
  const c = ui.coach;
  if(!q || c.pending) return;
  const req = { q, kind: opts.kind === 'week_review' ? 'week_review' : 'chat', week: opts.week || null, scope: opts.scope ? { session: opts.scope } : null, typed: !!opts.typed };
  ui.tab = 'coach'; ui.sheet = null;
  if(!coachLive() || c.noAccess){ render(); return; }
  if(req.kind === 'week_review'){
    const r = C.reviewFor(coachRows(), req.week);
    if(r){ c.scroll = r.id; render(); return; }
  }
  if(!coachAccepted()){ c.waiting = req; render(); return; }
  if(q.length > C.MAX_CHARS){ c.failed = { ...req, why:'too_long' }; render(); return; }
  if(limitToday()){ render(); return; }
  if(!online()){ c.failed = { ...req, why:'offline' }; render(); return; }
  c.failed = null; c.pending = { ...req, t0: Date.now() }; c.scroll = 'pending';
  render();
  try{
    const r = await cloud.askCoach({ question: q, kind: req.kind, week: req.week, scope: req.scope });
    const add = C.rowsFromAnswer(q, r, nowIso());
    S.chat = C.mergeRows(coachRows(), add);
    if(!r.stored) S.chatTotal = Math.max(S.chatTotal || 0, coachRows().length);
    c.remaining = typeof r.remaining === 'number' ? r.remaining : c.remaining;
    if(r.remaining === 0) S.coachLimitDay = today();
    c.off = false; c.noAccess = false;
    if(req.typed) c.text = '';
    c.scroll = add[add.length - 1].id;
    save();
  }catch(e){
    const k = C.errorKind(e);
    if(k === 'limit'){ S.coachLimitDay = today(); save(); }
    if(k === 'off') c.off = Date.now();
    if(k === 'no_access') c.noAccess = true;
    c.failed = k === 'limit' || k === 'off' || k === 'no_access' ? null : { ...req, why:k };
  }
  c.pending = null;
  const a = document.activeElement; if(a && a.blur && a.id === 'coachText') a.blur();
  render();
}
/* The account's copy of the thread, and the first-run flag. The server is
   the truth (a chat deleted on another phone goes here too). */
async function coachLoad(more){
  const c = ui.coach;
  if(!coachLive() || !online() || c.loading) return;
  c.loading = true;
  try{
    if(!c.checked){
      const v = await cloud.coachAccepted();
      if(v >= C.COPY_V) S.coachOk = v;
      else if(coachAccepted()) await cloud.acceptCoach(C.COPY_V);   // accepted here while offline
      c.checked = true;
    }
    /* Invite-only: a person without coach_access sees a calm card, not a broken chat. */
    try{ c.noAccess = !(await cloud.coachAccess()); }catch(e){ /* not known: the send says so */ }
    const rows = coachRows();
    const oldest = more && rows.length ? rows.reduce((a, r) => String(r.created_at) < a ? String(r.created_at) : a, String(rows[0].created_at)) : null;
    const r = await cloud.chatHistory({ before: oldest });
    S.chat = more ? C.mergeRows(rows, r.rows, 400) : C.mergeRows(r.rows, rows.filter(x => String(x.id).startsWith('local-')), 60);
    if(!more && r.total != null) S.chatTotal = r.total;
    save();
  }catch(e){ if(C.errorKind(e) === 'off') c.off = Date.now(); }
  c.loading = false;
  if(ui.tab === 'coach' || ui.tab === 'log' || ui.tab === 'settings') softRender();
}

/* After a working set is confirmed: rest, then (on the exercise's last set)
   the RIR question, then the next exercise moves to the top. */
function afterConfirm(i, j){
  const ex = S.draft.exercises[i], st = ex.sets[j];
  if(st.warmup){ save(); render(); return; }
  startRest(ex.rest);
  const remaining = ex.sets.some(s => !s.warmup && s.state === 'planned');
  /* The RIR that drives progression is asked once: after the last set, or on a
     heavy exercise with back-offs after the top set. */
  const rated = ex.kind === 'weight' || ex.kind === 'band';
  const topSet = ex.backoff && ex.sets.findIndex(s => !s.warmup) === j;
  ui.rir = rated && st.rir == null && (ex.backoff ? topSet : !remaining) ? { i, j } : null;
  if(!remaining){
    ui.open.delete(i);
    const nx = currentIdx(S.draft);
    if(nx != null) ui.scrollTo = nx;
  }
  save(); render();
}

const ACT = {

  coachQ: el => coachAsk(el.dataset.q, { kind: el.dataset.kind, week: el.dataset.week, scope: el.dataset.scope }),
  coachReview: el => coachAsk('How was my week?', { kind:'week_review', week: el.dataset.week }),

  coachNotNow: el => { S.coachDismiss = el.dataset.week; save(); render(); },
  coachSend: () => coachAsk(ui.coach.text, { typed:true }),
  coachRetry: () => { const f = ui.coach.failed; if(!f) return; ui.coach.failed = null; coachAsk(f.q, { kind:f.kind, week:f.week, scope:f.scope && f.scope.session, typed:f.typed }); },
  coachMore: () => coachLoad(true),

  buildBack: () => { const o = S.onboard; ui.building = null; if(o){ const m = G.firstMissing(o.answers, L); o.step = m >= 0 ? m : QN - 1; } ui.qBusy = false; ui.qPressed = null; save(); render(); },
  qAns: el => {
    const o = S.onboard, v = el.dataset.v, st = o ? o.step : -1;
    /* A tap on a question that has already moved on, or a second tap during
       the 150 ms advance, does nothing. */
    if(!o || ui.qBusy || +el.dataset.s !== st) return;
    if(st === 1 && (v === 'db' || v === 'home')){
      if(o.answers.place !== v) o.has = { bar:false, bands:false };
      else o.has = o.has || { ...(o.answers.has || {}) };
      o.answers.place = v; o.kitFor = v; save(); render(); return;
    }
    if(st === 0) o.answers.days = +v;
    else if(st === 1){ o.answers.place = v; o.answers.has = { bar:true, bands:true }; delete o.kitFor; }
    else if(st === 2) o.answers.level = v;
    else if(st === 4) o.answers.minutes = +v;
    save();
    ui.qPressed = v; ui.qBusy = true; render();
    setTimeout(() => {
      ui.qBusy = false;
      if(!S.onboard || S.onboard.step !== st) return;           // Back was pressed meanwhile

  tickNext: () => {
    const n = nextSet();

    afterConfirm(n.i, n.j);

  tick: el => {
    const i = +el.dataset.i, j = +el.dataset.j, ex = ex_(el), st = set_(el);
    /* A set from a saved file is history: its ✓ opens it for editing rather
       than un-ticking it into a planned set that Finish could drop. */
    if(st.state === 'legacy'){ openSetSheet(i, j); return; }
    if(st.state === 'planned'){
      if(!E.confirmSet(ex, st, 'tick', nowIso())){ openSetSheet(i, j); return; }
      afterConfirm(i, j);
    } else {
      const before = E.clone(st);
      E.unconfirmSet(st);
      if(ui.rir && ui.rir.i === i && ui.rir.j === j) ui.rir = null;
      save(); render();
      toast('Set unticked', () => { if(S.draft && S.draft.exercises[i] === ex){ ex.sets[j] = before; save(); render(); } });
    }
  },
  warm: el => {
    const i = +el.dataset.i, ex = ex_(el);
    ex.sets.splice(E.warmupIndex(ex), 0, E.warmupSet(ex));
    ui.open.add(i); save(); render();
  },
  bulk: el => {
    const i = +el.dataset.i, ex = ex_(el), now = nowIso(), d = S.draft;
    const before = E.clone(ex.sets), rirBefore = ui.rir;
    let n = 0, last = null;
    ex.sets.forEach((st, j) => { if(!st.warmup && st.state === 'planned' && E.confirmSet(ex, st, 'bulk', now)) n++; });
    if(!n){ const j = ex.sets.findIndex(s => !s.warmup && s.state === 'planned'); toast('No target to copy yet: enter the first set.'); if(j >= 0) openSetSheet(i, j); return; }
    ex.sets.forEach((st, j) => { if(!st.warmup && st.state !== 'planned') last = j; });
    if(ex.backoff) last = ex.sets.findIndex(s => !s.warmup);
    const left = ex.sets.filter(s => !s.warmup && s.state === 'planned').length;
    if(!left){
      ui.rir = last != null && ex.sets[last].rir == null && (ex.kind === 'weight' || ex.kind === 'band') ? { i, j:last } : null;
      ui.open.delete(i);
      const nx = currentIdx(S.draft); if(nx != null) ui.scrollTo = nx;
    }
    save(); render();
    /* One mis-tap here confirms a whole exercise, so it can be undone. */
    toast(n + ' set' + (n > 1 ? 's' : '') + ' confirmed as shown' + (left ? ' · ' + left + ' need numbers' : ''), () => {
      if(S.draft === d && d.exercises[i] === ex){ ex.sets = before; ui.rir = rirBefore; ui.open.add(i); save(); render(); }
    });

  sheet: el => openSetSheet(+el.dataset.i, +el.dataset.j),

  shband: el => {

  shsave: () => {
    const s = ui.sheet, ex = S.draft.exercises[s.i], st = ex.sets[s.j], v = s.v;
    const miss = E.fieldsOf(ex).filter(k => v[k] == null);
    if(miss.length){ toast('Enter ' + miss.join(' and ') + ' first.'); return; }
    for(const k of E.fieldsOf(ex)) st[k] = v[k];
    if(ex.kind === 'weight' || ex.kind === 'band') st.rir = v.rir;
    st.warmup = !!v.warmup;
    if(st.state !== 'done' || !st.doneAt) st.doneAt = nowIso();
    st.state = 'done'; st.via = 'sheet';
    if(!st.warmup) E.carryForward(ex, s.j);

  swap: el => {
    const i = +el.dataset.i, ex = S.draft.exercises[i];
    /* A friend's programme session: the library sheet, for today only. Dan
       keeps the text prompt (his coach exercises are not in the library). */
    if(genSession(S.draft) && canEdit()){
      const day = E.programmeDay(P(), S.draft.key);
      const si = day ? day.ex.findIndex(e => e.n === (ex.substitutedFor || ex.n)) : -1;
      if(si >= 0){ ui.sheet = { type:'swap', d:day.key, i:si, ses:i }; renderSheet(); return; }
    }
    const n = prompt('Swapped in what instead of "' + ex.n + '"?', '');
    if(!n || !n.trim()) return;
    /* Kept as a substitution, not logged under the prescribed name, or the
       history quietly becomes fiction. */
    ex.substitutedFor = ex.substitutedFor || ex.n;
    ex.n = n.trim();
    const { rec, target } = E.targets(E.tplOf(ex), aHist(), S.draft.date, S.draft.isDeload);
    ex.rec = rec;
    for(const st of ex.sets) if(st.state === 'planned') st.target = target ? { ...target } : null;
    ui.sheet = null; save(); render();

  fLbType: el => { const lb = S.draft.symptoms.find(x => x.area === 'low-back'); lb.type = lb.type === el.dataset.v ? null : el.dataset.v; if(lb.type !== 'pinch') lb.side = null; save(); renderSheet(); },

  saveSession: () => {
    const d = S.draft, now = nowIso();
    const res = E.finishSession(d, now, ui.sheet && ui.sheet.choice || undefined);
    if(res.blocked){ toast(res.blocked === 'empty' ? 'Nothing to save yet.' : 'Choose what happened to the unticked sets.'); return; }
    const plan = E.planSave(d, res.session, S.history, pend(), dir(), now);
    const wkBefore = weekDone();
    for(const item of plan.items) queueItem(item);
    endSession(); save(); render();
    const wkAfter = weekDone();
    /* The save that completes the week says so; the review card is next on Log. */
    toast((coachLive() && C.weekDoneToast(wkBefore.done, wkAfter.done, wkAfter.target))

  hrow: el => { const k = el.dataset.k; ui.hist.has(k) ? ui.hist.delete(k) : ui.hist.add(k); render(); },
  edit: el => {
    const item = merged().find(s => E.fileKey(s) === el.dataset.k);
    if(!item) return;
    if(S.draft && !confirm('Replace the session in progress?')) return;
    const d = E.editDraft(item, dir());
    if(!d.id) d.id = newId();
    endSession(); S.draft = d; ui.tab = 'log'; save(); window.scrollTo(0, 0); render();
  },
  del: el => {
    const k = el.dataset.k;
    const raw = [...pend()].reverse().find(q => !q.deleted && E.fileKey(q) === k) || S.history.find(h => E.fileKey(h) === k);
    if(!raw) return;
    if(!confirm('Delete ' + raw.name + ' on ' + raw.date + '? The file is marked deleted, and git keeps every earlier version.')) return;
    const { qid, ...body } = raw;
    /* Queued before history is touched: a tombstone is only pushed for a file
       GitHub already holds, and history is how sync knows that. */
    queueItem({ ...body, deleted:true, savedAt:nowIso() });
    S.history = S.history.filter(h => E.fileKey(h) !== k);
    save(); render(); flushAll();
  },
  /* Confirms a suspect session: the file gets verified:true and nothing

  verify: el => {
    const k = el.dataset.k;
    const raw = [...pend()].reverse().find(q => !q.deleted && E.fileKey(q) === k) || S.history.find(h => E.fileKey(h) === k);
    if(!raw) return;
    if(!confirm('Confirm ' + raw.name + ' on ' + raw.date + ' was lifted as recorded? It will count toward the next targets.')) return;
    const { qid, unverified, ...body } = raw;
    queueItem({ ...body, verified:true });
    ui.hist.delete(k); render(); flushAll();
  },

  logbw: () => {
    const v = num(($('[data-f="bwkg"]') || {}).value);
    if(v == null || v < 30 || v > 250){ toast('Enter a weight in kg first.'); return; }
    sync.enqueueBw({ type:'bw', date:today(), kg:v, loggedAt:nowIso() });
    render(); toast('Logged ' + v + ' kg'); sync.flushQueue(); bodySync().then(softRender);
  },
  logmark: () => {
    const e = { type:'floor', date:today(), loggedAt:nowIso() };
    let any = false;
    FLOOR_MARKS.forEach(([k]) => { const v = num(($('[data-mark="' + k + '"]') || {}).value); if(v != null){ e[k] = v; any = true; } });
    if(!any){ toast('Nothing filled in.'); return; }
    sync.enqueueBw(e); render(); sync.flushQueue(); bodySync().then(softRender);
  },
  savecfg: () => { save(); mode(); setSync('', 'saved'); sync.flushQueue({ quiet:true }).then(render); },

  acSend: async () => {
    const email = (ui.ac.email || cloud.email()).trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ acSay('Enter your email address first.', 'bad'); render(); return; }
    ui.ac.email = email; ui.ac.busy = true; acSay('Sending…'); render();
    try{ await cloud.requestCode(email); ui.ac.sent = true; ui.ac.code = ''; acSay('Code sent to ' + email + '. It can take a minute; check spam too.', 'ok'); }
    catch(e){ acSay(explain(e), 'bad'); }
    ui.ac.busy = false; render();
  },
  acVerify: async () => {
    const code = String(ui.ac.code || '').replace(/\D/g, '');
    if(code.length < 8){ acSay('Enter the 8-digit code from the email.', 'bad'); render(); return; }
    ui.ac.busy = true; acSay('Checking…'); render();
    try{
      const who = await cloud.verifyCode(ui.ac.email || cloud.email(), code);
      claimStorage(S, sync.cfgOk()); save();
      if(mode() === 'account') setSync('ok', 'signed in');
      ui.ac = { email:'', code:'', sent:false, busy:false, msg:'', cls:'' };
      if(who.foreign){ acSay('Signed in, but nothing on this phone will be uploaded: it belongs to another account.', 'bad'); render(); return; }
      acSay('Signed in. New sessions now also go to your account.', 'ok');
      if(mode() === 'account' && friend() && !P() && !who.foreign){ ui.ac.busy = false; loadProgramme(); }
      render();
      adoptGithubQueue();
      await cloud.flushQueue({ quiet:true });
      if(mode() === 'account' && !S.history.length) await cloud.pullHistory();
    }catch(e){ ui.ac.busy = false; acSay(explain(e), 'bad'); }
    softRender();
  },
  acReset: () => { ui.ac = { email:'', code:'', sent:false, busy:false, msg:'', cls:'' }; render(); },
  acImport: async () => {
    if(cloud.foreign()){ acSay(explain(cloud.lastError() || { code:'foreign', message:'This phone holds another account’s data. Nothing was copied.' }), 'bad'); render(); return; }
    const list = rawAll();
    if(!list.length){ acSay('There are no sessions on this phone to copy.', ''); render(); return; }
    ui.ac.busy = true; acSay('Copying ' + list.length + ' sessions…'); render();
    try{
      const r = await cloud.importHistory(list);
      const err = cloud.lastError();
      acSay(r.held ? 'Copied ' + r.saved + ' of ' + r.total + ' sessions. ' + r.held + ' are held on this phone and are sent on the next try. ' + (err ? explain(err) : '')
        : 'Copied all ' + r.total + ' sessions to your account.', r.held ? 'bad' : 'ok');
    }catch(e){ acSay(explain(e), 'bad'); }
    ui.ac.busy = false; render();
  },
  acSignOut: () => {
    const held = cloudQ().length, prog = !!S.programme;
    /* Friends: the programme leaves the phone with the person (privacy: the
       next account here must never see it); an unsent change is said aloud. */
    const progLine = !prog ? '' : S.programmeDirty ? ' Your latest programme change hasn’t been saved to your account yet and will be lost.' : ' Your programme stays in your account and comes back when you sign in.';
    if(!confirm('Sign out of your account? ' + (prog ? 'Your sessions stay' : 'Everything stays') + ' on this phone' + (held ? ', including ' + held + ' session' + (held > 1 ? 's' : '') + ' not yet sent' : '') + '.' + progLine)) return;
    const em = cloud.email();
    cloud.signOut(); ui.cloudStatus = null; ui.page = null; ui.tab = 'log';
    ui.si = { step:'welcome', email: em || '', code:'', busy:false, err:null, until:0 };
    acSay(prog ? 'Signed out. Your sessions are still on this phone.' : 'Signed out. Nothing on this phone was removed.', ''); render();
  },
  test: async () => {
    save();
    try{
      const r = await sync.testRepo();
      if(!r) throw new Error('repo not found');
      setSync('ok', 'connected');
      alert('Connected to ' + r.full_name + '\nPrivate: ' + r.private + '\nWrite access: ' + (r.permissions && r.permissions.push ? 'yes' : 'NO: token lacks Contents: write'));
    }catch(e){ setSync('bad', 'failed'); alert('Failed: ' + e.message); }
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ history:S.history, bw:S.bw, queue:S.queue, bwQueue:S.bwQueue, cloudQueue:cloudQ(), draft:S.draft, corrupt:corruptBackups() }, null, 2)], { type:'application/json' });
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = 'ledger-backup-' + today() + '.json'; a.click(); URL.revokeObjectURL(u);
  }
};

const INPUT = {
  exnote: el => { S.draft.exercises[+el.dataset.i].note = el.value; save(); },
  libq: el => { ui.libQ = el.value; ui.exOpen = null; const l = document.getElementById('exList'); if(l) l.innerHTML = exListHTML(); },
  addq: el => { if(ui.sheet && ui.sheet.type === 'addex'){ ui.sheet.q = el.value; $('#addList').innerHTML = addExList(el.value); } },
  shval: el => { if(ui.sheet) ui.sheet.v[el.dataset.k] = num(el.value); },
  notes: el => { S.draft.notes = el.value; save(); },
  acEmail: el => { ui.ac.email = el.value; },
  /* Start page: enable Send without re-rendering (keeps the keyboard up). */
  siEmail: el => { ui.si.email = el.value.trim(); const b = $('#siSend'); if(b) b.disabled = !/@.+\./.test(ui.si.email) || !online() || ui.si.until > Date.now(); },
  /* The code submits itself on the eighth digit (Supabase OTP length is 8); a pasted "4812 0736" works. */
  siCode: el => { const v = el.value.replace(/\D/g, '').slice(0, 8); if(el.value !== v) el.value = v; ui.si.code = v; if(v.length === 8) siVerify(); },
  acCode: el => { ui.ac.code = el.value; },
  /* Without re-rendering, so the keyboard stays up. */
  coachText: el => {
    ui.coach.text = el.value;
    el.rows = Math.min(4, Math.max(1, el.value.split('\n').length, Math.ceil(el.value.length / 34)));
    const b = $('#coachSend'); if(b) b.disabled = !online() || !!ui.coach.pending || !el.value.trim();
    const n = $('#coachCount'); if(n) n.textContent = countText(el.value);
  }
};
const CHANGE = {
  findate: el => {
    if(!el.value || el.value > today()) return;
    S.draft.date = el.value; E.retarget(S.draft, aHist(), P()); save(); renderSheet(); render();
  },
  cfg: el => {
    const k = el.dataset.k;
    if(k === 'deloadWeeks') S.settings[k] = parseInt(el.value, 10) || 5;
    else if(k === 'priorPinches'){ const n = parseInt(el.value, 10); S.settings[k] = Number.isFinite(n) && n >= 0 ? n : null; }
    else if(k === 'bands') S.settings.bands = el.value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    else S.settings[k] = el.value.trim();
    save(); mode();
  },
  cfgbool: el => { S.settings[el.dataset.k] = el.checked; save(); if(el.dataset.k === 'wakeLock') syncWake(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn) fn(el, e);
});
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if(f && INPUT[f]) INPUT[f](e.target); });
document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f; if(f && CHANGE[f]) CHANGE[f](e.target); });
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.f === 'siEmail'){ e.preventDefault(); siSend(); }
  /* The coach: Enter sends, Shift+Enter is a new line. */
  if(e.key === 'Enter' && !e.shiftKey && e.target.dataset && e.target.dataset.f === 'coachText'){ e.preventDefault(); if(online() && ui.coach.text.trim()) coachAsk(ui.coach.text, { typed:true }); }
});

/* ---------------------------------------------------------------- boot */
mode();
save();
const pending = S.queue.length + S.bwQueue.length + (accountOwns() ? cloudQ().length : 0);
setSync(pending ? 'pending' : '', pending ? pending + ' pending' : (sync.cfgOk() || (mode() === 'account' && cloud.signedIn()) ? 'ready' : 'no token'));
render();
try{
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(p => p || navigator.storage.persist())
      .then(p => { ui.persist = p ? 'persistent' : 'best-effort'; if(ui.tab === 'settings') softRender(); }).catch(() => { ui.persist = 'best-effort'; });
  } else ui.persist = 'best-effort';
}catch(e){ ui.persist = 'best-effort'; }
if(sync.cfgOk()) sync.flushQueue({ quiet:true }).then(() => { if(!S.history.length || S.adoptPending) return pullGithub(); }).then(softRender);
adoptGithubQueue();
if(cloud.signedIn()) cloud.flushQueue({ quiet:true }).then(() => { if(mode() === 'account' && !S.history.length) return cloud.pullHistory(); }).then(bodySync).then(softRender);
healthSync().then(softRender);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') healthSync().then(softRender); });
window.addEventListener('online', () => { sync.flushQueue({ quiet:true }); if(cloud.signedIn()){ cloud.flushQueue({ quiet:true }); bodySync().then(softRender); if(S.programmeDirty) cloud.pushProgramme().then(softRender, () => {}); } if(screen() || ui.page || coachTab()) softRender(); });
window.addEventListener('offline', () => { if(screen() || ui.page || coachTab()) softRender(); });
/* The coach's copy of the thread (and whether this week is reviewed), only
   when signed in: a signed-out phone makes no call. */
if(coachLive() && online()) coachLoad();
/* Friends: a signed-in account phone with no programme on it asks the
   account first ("Loading your programme…"); one with a programme syncs it. */
if(needsProgramme() && cloud.signedIn() && !S.onboard) loadProgramme();
else if(friend() && cloud.signedIn() && (P() || S.programmeDirty)) cloud.syncProgramme().then(softRender);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
