<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f7f7f8; --panel:#fff; --line:#e2e4e7; --text:#16181b; --dim:#63686e;
  --accent:#2f6df6; --ok:#177a47; --on-ok:#fff; --warn:#7d5a00; --bad:#c0392b; --chip:#eef0f3;
  --scrim:rgba(10,12,14,.45); --hdr:52px; --bar:64px; --nav:56px; --rir:100px; --next:64px;
  --rirH:0px; --nextH:0px;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111417; --panel:#191d21; --line:#2a2f35; --text:#e8eaed; --dim:#8b9198;
    --accent:#5b8dff; --ok:#3fbd7a; --on-ok:#0d1f15; --warn:#d8a537; --bad:#e5705f; --chip:#22272c;
    --scrim:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); overflow-x:hidden;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
input,select,textarea{font:inherit; font-size:16px}
[hidden]{display:none !important}

/* ---- header */
header{
  position:sticky; top:0; z-index:30; background:var(--panel);
  border-bottom:1px solid var(--line); padding:0 6px 0 14px; padding-top:var(--safe-t);
  display:flex; align-items:center; gap:8px; min-height:calc(var(--hdr) + var(--safe-t));
}
header h1{font-size:17px; margin:0; flex:1; min-width:0; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#datechip{font-size:12.5px; padding:3px 9px; border-radius:99px; background:var(--chip); color:var(--dim); white-space:nowrap}
#datechip.amber{color:var(--warn); background:rgba(184,134,11,.15)}
#sync{font-size:12px; padding:4px 9px; border-radius:99px; background:var(--chip); color:var(--dim); white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis}
#sync.ok{color:var(--ok)} #sync.pending{color:var(--warn)} #sync.bad{color:var(--bad)}
.ib{width:44px; height:44px; min-width:44px; border:none; background:none; border-radius:10px; font-size:20px; line-height:1; color:var(--dim)}
.ib:active{background:var(--chip)}

main{padding:12px 12px 0; max-width:640px; margin:0 auto; padding-bottom:calc(var(--nav) + var(--safe-b) + 90px)}
body.chips{--rirH:var(--rir)}
body.next{--nextH:var(--next)}
body.ses main{padding-bottom:calc(var(--bar) + var(--rirH) + var(--nextH) + var(--safe-b) + 40px)}
/* Shown only if the page script never ran (for example a module that failed
   to load on a patchy signal mid-update). render() replaces it at once. */
#bootmsg{opacity:0; animation:appear 0s 4s forwards}
@keyframes appear{to{opacity:1}}

/* ---- common */
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; scroll-margin-top:calc(var(--hdr) + var(--safe-t) + 8px)}
.card h3{margin:0; font-size:16px; line-height:1.25; overflow-wrap:anywhere}
.sub{color:var(--dim); font-size:13px}
.center{text-align:center}
.grow{flex:1; min-width:0}
.row{display:flex; gap:8px; align-items:center}
label{display:block; font-size:13px; color:var(--dim); margin:12px 0 4px}
input,select,textarea{width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text)}
textarea{min-height:90px; resize:vertical}
.btn{min-height:48px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:15px}
.btn.primary,.big.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45; cursor:default}
.w100{width:100%}
.big{display:block; width:100%; min-height:56px; border-radius:12px; border:1px solid var(--line); font-size:17px; margin:4px 0 8px; padding:10px 14px}
.rowbtn{display:flex; align-items:center; gap:10px; width:100%; min-height:56px; text-align:left; padding:8px 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:8px}
.pill{display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--chip); color:var(--dim); margin-right:4px; white-space:nowrap}
.pill.warn{color:var(--warn)} .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}
.banner{border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:10px}
.banner.warn{background:rgba(184,134,11,.13); border:1px solid rgba(184,134,11,.35)}
.banner.bad{background:rgba(192,57,43,.11); border:1px solid rgba(192,57,43,.32)}
.banner.info{background:rgba(47,109,246,.09); border:1px solid rgba(47,109,246,.28)}
.banner .row{margin-top:8px}
.banner .btn{flex:1}
.hint{font-size:13px; color:var(--dim); margin-top:6px}
.empty{text-align:center; color:var(--dim); padding:30px 10px; font-size:14px}

/* ---- exercise cards */
.exhead{display:flex; align-items:center; gap:2px; margin:-6px -6px 0 0}
.exhead h3{flex:1; min-width:0}
.tline{font-size:13.5px; color:var(--dim); margin:2px 0 8px; font-variant-numeric:tabular-nums}
.info{font-size:13.5px; color:var(--dim); border-top:1px solid var(--line); padding-top:6px; margin-bottom:8px}
.info p{margin:6px 0}
.info b{color:var(--text)}
.setrow{display:grid; grid-template-columns:44px 1fr 56px; gap:8px; align-items:center; min-height:56px; margin-bottom:6px}
.sn{text-align:center; color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums}
.setrow.warm .sn{color:var(--warn); font-weight:700}
.val{min-height:56px; border:1px solid var(--line); border-radius:10px; background:var(--bg); text-align:left; padding:0 12px; color:var(--dim); font-size:17px; font-variant-numeric:tabular-nums; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.setrow.done .val{color:var(--text); font-weight:650}
.tick{width:56px; height:56px; border-radius:12px; border:1px solid var(--line); background:var(--chip); font-size:22px; color:var(--dim)}
.setrow.done .tick{background:var(--ok); border-color:var(--ok); color:var(--on-ok)}
.setrow.legacy .tick{background:var(--chip); border-color:var(--line); color:var(--ok)}
.exfoot{display:flex; gap:8px; margin-top:4px}
.exfoot button{flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:14.5px}
.exline{display:flex; align-items:center; gap:8px; width:100%; min-height:56px; border:none; background:none; text-align:left; padding:0 4px; font-size:15.5px}
.card.collapsed{padding:0 8px}
.exline .cs{margin-left:auto; color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap}
.exline.ok .cs{color:var(--ok); font-weight:600}
.exline b{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---- bottom nav and session bar */
#tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--safe-b)}
#tabs button{flex:1; min-height:var(--nav); border:none; background:none; color:var(--dim); font-size:13.5px}
#tabs button.on{color:var(--accent); font-weight:650}
#bar{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--panel); border-top:1px solid var(--line); padding-bottom:var(--safe-b)}
.barin{display:flex; align-items:center; gap:8px; height:var(--bar); padding:0 12px}
#barT{min-width:96px; min-height:48px; border:none; background:none; text-align:left; font-size:24px; font-weight:650; font-variant-numeric:tabular-nums; padding:0 4px}
#barT small{display:block; font-size:11px; font-weight:400; color:var(--dim); line-height:1}
#barT.over{color:var(--ok)}
#plus30{min-width:56px; min-height:48px; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:14px}
#finBtn{width:120px; min-height:48px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:650; font-size:16px; margin-left:auto}
/* The next set's ✓, in thumb reach at the bottom of the screen. */
#nextSet{display:flex; align-items:center; gap:10px; width:calc(100% - 24px); height:56px; margin:8px 12px 0; padding:0 14px; border:none; border-radius:12px; background:var(--ok); color:var(--on-ok); text-align:left; font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; overflow:hidden}
#nextSet.enter{background:var(--chip); color:var(--text); border:1px solid var(--line)}
#nextSet .nx{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#nextSet small{display:block; font-size:12px; font-weight:500; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#nextSet .ck{font-size:24px}
.shrest{font-size:14px; font-weight:600; color:var(--dim); font-variant-numeric:tabular-nums}
.shrest.over{color:var(--ok)}
#rirRow{border-bottom:1px solid var(--line); padding:6px 12px 10px}
#rirRow.last{border-top:2px solid var(--accent); background:rgba(47,109,246,.07)}
.rirlab{display:flex; align-items:center; font-size:14px; font-weight:600; min-height:32px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{min-width:56px; min-height:48px; flex:1; border-radius:10px; border:1px solid var(--line); background:var(--chip); font-size:17px; font-weight:600; padding:0 8px}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.chip.s48{min-width:48px}
.chips.small .chip{flex:0 1 auto; font-size:15px; font-weight:500}

/* ---- sheets */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:40}
.panel{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--panel); border-radius:16px 16px 0 0; max-height:88vh; overflow-y:auto; padding:10px 14px calc(14px + var(--safe-b)); max-width:640px; margin:0 auto; overscroll-behavior:contain}
.panel.full{top:0; max-height:none; border-radius:0; padding-top:calc(10px + var(--safe-t))}
.grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 8px}
.sh-h{font-weight:650; font-size:16px; margin:2px 0 6px; display:flex; align-items:center; gap:8px}
.step{display:grid; grid-template-columns:56px 1fr 56px; gap:8px; align-items:center}
.step button{height:56px; border-radius:12px; border:1px solid var(--line); background:var(--chip); font-size:24px}
.step input{height:56px; text-align:center; font-size:22px; font-weight:650; font-variant-numeric:tabular-nums}
.toggle{min-height:48px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--chip)}
.toggle.on{border-color:var(--warn); color:var(--warn); font-weight:650}
.textbtn{min-height:48px; padding:0 12px; border:none; background:none; color:var(--bad); font-size:15px}
.textbtn.plain{color:var(--accent)}
.save56{display:block; width:100%; min-height:56px; margin-top:16px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:17px; font-weight:650}
.save56[disabled]{opacity:.4; cursor:default}
.menu button{display:block; width:100%; min-height:56px; text-align:left; padding:0 14px; border:none; border-bottom:1px solid var(--line); background:none; font-size:16px}
.menu button.danger{color:var(--bad); margin-top:16px; border-top:1px solid var(--line)}
.fsec{border-top:1px solid var(--line); padding:12px 0}
.fsec h4{margin:0 0 8px; font-size:14.5px}
.fsec.hl{background:rgba(184,134,11,.08); border-radius:10px; padding:12px 8px}
.sumline{font-size:14px; padding:3px 0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.warnbox{background:rgba(184,134,11,.13); border:1px solid rgba(184,134,11,.35); border-radius:12px; padding:10px}
.warnbox .row{margin-top:8px}
.warnbox .btn{flex:1; font-size:14px; padding:8px}
.warnbox .btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.pinch{font-size:13.5px; margin-top:8px; color:var(--bad)}

/* ---- history */
.hrow{display:flex; align-items:center; gap:8px; width:100%; min-height:56px; border:none; background:none; text-align:left; padding:4px 2px; flex-wrap:wrap}
.hist{border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hdet{padding:0 2px 12px; font-size:13.5px; color:var(--dim)}
.hdet b{color:var(--text)}
.hdet .row{margin-top:10px}
.hdet .row .btn{min-height:44px; flex:1}
.hdet .row .btn + .btn{margin-left:8px}

#toast{position:fixed; left:12px; right:12px; z-index:35; bottom:calc(var(--nav) + var(--safe-b) + 10px); background:var(--text); color:var(--bg); border-radius:12px; padding:6px 6px 6px 14px; display:flex; align-items:center; gap:8px; font-size:14.5px; max-width:616px; margin:0 auto}
body.ses #toast{bottom:calc(var(--bar) + var(--rirH) + var(--nextH) + var(--safe-b) + 10px)}
#toast button{min-height:44px; min-width:64px; border:none; border-radius:9px; background:transparent; color:var(--accent); font-weight:700}
</style>
</head>
<body>

<header>
  <h1 id="title">Ledger</h1>
  <span id="datechip" hidden></span>
  <span id="sync">–</span>
  <button class="ib" id="menuBtn" data-act="menu" aria-label="Menu" hidden>⋯</button>
</header>

<main id="view"><div class="empty" id="bootmsg">Ledger did not start. This can happen on a weak signal just after an update. <a href="./">Reload</a></div></main>

<nav id="tabs">
  <button data-act="tab" data-tab="log" class="on">Log</button>
  <button data-act="tab" data-tab="history">History</button>
  <button data-act="tab" data-tab="body">Body</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>

<div id="bar" hidden>
  <div id="rirRow" hidden></div>
  <button id="nextSet" data-act="tickNext" hidden></button>
  <div class="barin">
    <button id="barT" data-act="restStop" aria-label="Rest timer">0:00</button>
    <button id="plus30" data-act="rest30" hidden>+30s</button>
    <button id="finBtn" data-act="finish">Finish</button>
  </div>
</div>

<div id="sheet"></div>
<div id="toast" hidden></div>

<script type="module">
import * as E from './engine.js?v=5-3';
import { makeSync } from './sync.js?v=5-3';

/* ---------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const today = () => E.localISO(new Date());
/* Comma or dot: Czech keyboards type 72,4. */
const num = v => { const s = String(v ?? '').trim().replace(',', '.'); if(s === '') return null; const n = parseFloat(s); return Number.isFinite(n) ? n : null; };
const newId = () => 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const mmss = sec => { const s = Math.abs(Math.round(sec)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const daysAgo = iso => E.daysBetween(iso, today());

/* ---------------------------------------------------------------- storage */
/* E.loadState decides what to trust: ledger_v5, or on the first run after the
   upgrade ledger_v4 / ledger_v3. Once v5 exists the older keys are never read
   again except for the token, because they are a frozen snapshot of upgrade
   day. Older keys are never written or deleted. Anything unreadable is copied
   aside as ledger_corrupt_<key>_<time> (Settings → Export includes them). */
const LS = E.LS_KEY;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function backupCorrupt(k, raw){
  try{
    for(let i = 0; i < localStorage.length; i++){
      const kk = localStorage.key(i);
      if(kk && kk.startsWith('ledger_corrupt_' + k + '_') && localStorage.getItem(kk) === raw) return;
    }
    localStorage.setItem('ledger_corrupt_' + k + '_' + Date.now(), raw);
  }catch(e){}
}
let bootNotice = null;
function load(){
  const r = E.loadState(lsGet);
  for(const b of r.backups) backupCorrupt(b.key, b.raw);
  bootNotice = r.notice;
  return r.state;
}
function corruptBackups(){
  const out = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('ledger_corrupt_')) out[k] = localStorage.getItem(k);
    }
  }catch(e){}
  return out;
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ setSync('bad', 'storage full'); }
}

let S = load();

function setSync(cls, msg){ const el = $('#sync'); el.className = cls || ''; el.textContent = msg; }
const sync = makeSync({
  fetch: (u, i) => fetch(u, i), getState: () => S, save,
  onStatus: (c, m) => { setSync(c, m); if(c !== 'pending') softRender(); }
});
const dir = () => sync.dir();
const aHist = () => E.analysisHistory(S.history, S.queue);
const merged = () => E.mergedHistory(S.history, S.queue);

/* An edit opened by the v4 page carries no origin; its current path is the
   best evidence of where it came from. */
if(S.draft){
  if(!S.draft.id) S.draft.id = newId();
  if(S.draft.editing && !S.draft.originPath){
    S.draft.originPath = E.pathOf(S.draft, dir()); S.draft.origDate = S.draft.date; S.draft.origKey = S.draft.key;
  }
}

/* ---------------------------------------------------------------- ui state */
const ui = { tab:'log', open:new Set(), info:new Set(), sheet:null, rir:null, hist:new Set(), scrollTo:null, persist:null, undo:null, toastT:0, notice:bootNotice, finishBack:null };

function toast(msg, undo){
  const el = $('#toast');
  clearTimeout(ui.toastT);
  ui.undo = undo || null;
  el.innerHTML = '<span class="grow">' + esc(msg) + '</span>' + (undo ? '<button data-act="undo">Undo</button>' : '');
  el.hidden = false;
  ui.toastT = setTimeout(() => { el.hidden = true; ui.undo = null; }, undo ? 6000 : 2600);
}

/* ---------------------------------------------------------------- rest timer */
/* Vibrates once per rest, not on every tick. A hidden page cannot vibrate at
   all, which is why the screen is kept on during a session. */
const rest = { on:false, end:0, buzzed:false };
function startRest(sec){
  if(!S.settings.restOn || !sec) return;
  Object.assign(rest, { on:true, end:Date.now() + sec*1000, buzzed:false });
  paintBar();
}
function stopRest(){ rest.on = false; paintBar(); }
function paintBar(){
  const t = $('#barT'), p = $('#plus30'), sr = document.getElementById('shRest');
  if(!S.draft || $('#bar').hidden){ if(sr) sr.textContent = ''; return; }
  if(rest.on){
    const left = Math.round((rest.end - Date.now()) / 1000);
    if(left <= 0 && !rest.buzzed){ rest.buzzed = true; try{ navigator.vibrate && navigator.vibrate([120, 80, 120]); }catch(e){} }
    if(left < -180){ rest.on = false; return paintBar(); }
    t.innerHTML = (left < 0 ? '+' : '') + mmss(left) + '<small>' + (left <= 0 ? 'rest over' : 'rest') + '</small>';
    t.classList.toggle('over', left <= 0);
    p.hidden = false;
    /* The set sheet covers the bar, so it carries its own copy of the timer. */
    if(sr){ sr.textContent = (left <= 0 ? 'rest over +' : 'rest ') + mmss(left); sr.classList.toggle('over', left <= 0); }
  } else {
    if(sr) sr.textContent = '';
    const since = (Date.now() - Date.parse(S.draft.startedAt)) / 1000;
    t.innerHTML = S.draft.editing ? 'Edit<small>saved session</small>'
      : (since >= 0 && since < 12*3600 ? mmss(since) : '–') + '<small>session</small>';
    t.classList.remove('over');
    p.hidden = true;
  }
}
setInterval(paintBar, 500);

/* ---------------------------------------------------------------- wake lock */
/* The screen stays on while a session is open, so the rest timer is visible
   and can vibrate. Re-requested whenever the page comes back. */
let wake = null, wakeBusy = false;
async function syncWake(){
  const want = !!S.draft && S.settings.wakeLock !== false && document.visibilityState === 'visible' && ('wakeLock' in navigator);
  if(want && !wake && !wakeBusy){
    wakeBusy = true;
    try{
      wake = await navigator.wakeLock.request('screen');
      if(wake && wake.addEventListener) wake.addEventListener('release', () => { wake = null; });
    }catch(e){ wake = null; }
    wakeBusy = false;
  } else if(!want && wake && document.visibilityState === 'visible') releaseWake();
}
function releaseWake(){ const w = wake; wake = null; try{ w && w.release && w.release(); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ syncWake(); paintBar(); } });

/* ---------------------------------------------------------------- render */
function render(){
  const d = S.draft, ses = ui.tab === 'log' && !!d;
  document.title = d ? 'Ledger · ' + d.name : 'Ledger';
  $('#title').textContent = ses ? d.name : 'Ledger';
  const chip = $('#datechip');
  chip.hidden = !ses;
  if(ses){ const isToday = d.date === today(); chip.textContent = isToday ? 'Today' : E.niceDate(d.date); chip.classList.toggle('amber', !isToday); }
  $('#menuBtn').hidden = !d;
  document.body.classList.toggle('ses', ses);
  document.body.classList.toggle('chips', ses && !!ui.rir);
  $('#tabs').hidden = ses;
  $('#bar').hidden = !ses;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  $('#view').innerHTML = ui.tab === 'log' ? viewLog() : ui.tab === 'history' ? viewHistory() : ui.tab === 'body' ? viewBody() : viewSettings();
  renderRir(); renderNext(); renderSheet(); paintBar();
  if(ui.scrollTo != null){
    const el = document.getElementById('ex-' + ui.scrollTo); ui.scrollTo = null;
    if(el) el.scrollIntoView({ block:'start' });
  }
  syncWake();
}
/* A background sync must not wipe what Dan is typing. */
function softRender(){
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
  render();
}

function noticeBanner(){
  if(!ui.notice) return '';
  const t = ui.notice === 'v5-unreadable'
    ? '<b>This phone’s saved data could not be read.</b> The GitHub settings were kept and the log reloads from GitHub. Anything that had not synced yet is only in a raw copy on this phone: Settings → Export JSON includes it.'
    : '<b>The session in progress could not be read</b> and was set aside. A raw copy is kept on this phone: Settings → Export JSON includes it.';
  return '<div class="banner bad">' + t + '<div class="row"><button class="btn" data-act="noticeOk">OK</button></div></div>';
}
function tokenBanner(){
  return sync.cfgOk() ? '' : '<div class="banner warn">No GitHub token. Log normally: sessions are held on this phone and pushed once a token is set in <b>Settings</b>.</div>';
}
function queueBanner(){
  const n = S.queue.length + S.bwQueue.length;
  return n ? '<div class="banner warn"><b>' + n + ' item' + (n > 1 ? 's' : '') + ' not yet on GitHub.</b> Held on this phone.<div class="row"><button class="btn" data-act="retry">Retry now</button></div></div>' : '';
}
function deloadBanner(aH){
  const r = E.deloadCheck(aH, S.bw, S.settings, today());
  if(!r.codes.length) return '';
  const list = r.codes.map(c => '<div class="hint">· ' + esc(c.t) + ' <span class="pill' + (c.sev === 'severe' ? ' bad' : c.sev === 'mod' ? ' warn' : '') + '">' + c.c + '</span></div>').join('');
  /* Only the next session started is set up as a deload automatically; the
     rest of the week has to be switched on by hand, so the banner says so. */
  const head = r.fire
    ? '<b>Deload due.</b> The next session starts at ' + Math.round(E.DELOAD.loadPct*100) + '% of working load at the bottom of each rep range. The deload is a week: for the other sessions this week, use ⋯ → Deload session.'
    : '<b>Watch.</b> Not enough to call a deload yet.';
  return '<div class="banner ' + (r.fire ? 'bad' : 'warn') + '">' + head + list + '</div>';
}

/* ---------------------------------------------------------------- log view */
const isStale = d => E.isStaleDraft(d, Date.now());
const currentIdx = d => { const i = d.exercises.findIndex(ex => ex.sets.some(s => !s.warmup && s.state === 'planned')); return i < 0 ? null : i; };

function viewLog(){
  const aH = aHist();
  /* During a session the header pill carries sync state; the space goes to
     the exercise in hand. */
  if(!S.draft) return noticeBanner() + tokenBanner() + queueBanner() + deloadBanner(aH) + pickerHTML(aH);
  const d = S.draft;
  let h = noticeBanner();
  if(isStale(d)) h += '<div class="banner warn"><b>Unfinished ' + esc(d.name) + ' from ' + esc(E.niceDate(d.date)) + '.</b> Finish it with what was done, or discard it.'
    + '<div class="row"><button class="btn primary" data-act="finish">Finish it</button><button class="btn danger" data-act="discard">Discard</button></div></div>';
  if(d.editing) h += '<div class="banner info">Editing a saved session. Saving pushes a new version; git keeps the old one.'
    + (d.unverified ? ' <b>This session is unverified</b> and stays out of the rules after saving. To include it, use <b>It happened</b> in History.' : '') + '</div>';
  if(d.isDeload) h += '<div class="banner info"><b>Deload session.</b> ' + Math.round(E.DELOAD.loadPct*100) + '% at the bottom of each range. Should feel easy.</div>';
  const cur = currentIdx(d);
  d.exercises.forEach((ex, i) => { h += exCard(ex, i, cur, aH); });
  if(!d.exercises.length) h += '<div class="empty">No exercises yet. ⋯ → Add exercise.</div>';
  return h;
}

function pickerHTML(aH){
  const plan = E.weekPlan(merged(), today());
  const next = E.nextTemplate(plan);
  const deload = E.deloadCheck(aH, S.bw, S.settings, today()).fire;
  let h = '';
  if(next) h += '<button class="big primary" data-act="start" data-key="' + next + '">Start ' + esc(E.TEMPLATES[next].name) + (deload ? ' · deload' : '') + '</button>';
  const open = plan.filter(p => p.state !== 'done');
  h += '<div class="sub center" style="margin-bottom:12px">' + (open.length
    ? 'Not yet this week: ' + open.map(p => esc(p.name.split(' — ')[0]) + ' (' + p.day + (p.state === 'unverified' ? ', unverified' : '') + ')').join(', ')
    : 'All four lifts are logged this week.') + '</div>';
  for(const [k, t] of Object.entries(E.TEMPLATES)){
    if(k === next) continue;
    const sub = k === 'floor' ? '<br><span class="sub">Today: ' + esc(E.floorFor(today()).map(r => E.ROUTINES[r].name.split(' — ')[0]).join(' · ')) + '</span>' : '';
    h += '<button class="rowbtn" data-act="start" data-key="' + k + '"><span class="grow"><b>' + esc(t.name) + '</b>' + sub + '</span><span class="pill">' + esc(t.day) + '</span></button>';
  }
  return h;
}

function targetLine(ex){
  const w = ex.sets.filter(s => !s.warmup);
  const pl = w.find(s => s.state === 'planned' && s.target) || w.find(s => s.target);
  const parts = [];
  if(pl) parts.push('Target ' + E.setText(ex, { state:'planned', target:pl.target }) + (pl.target.src === 'seed' ? ' (first time)' : ''));
  else if(ex.rep) parts.push((w.length || ex.targetSets) + ' × ' + (ex.rep[0] === ex.rep[1] ? ex.rep[0] : ex.rep[0] + '–' + ex.rep[1]));
  if(ex.tplRir != null) parts.push('RIR ' + ex.tplRir);
  if(ex.rest) parts.push('rest ' + mmss(ex.rest));
  if(ex.rec) parts.push(ex.rec.rule);
  return parts.join(' · ');
}

function exCard(ex, i, cur, aH){
  const w = ex.sets.filter(s => !s.warmup);
  const planned = w.filter(s => s.state === 'planned').length;
  const complete = w.length > 0 && planned === 0;
  const expanded = ui.open.has(i) || (i === cur && !complete);
  if(!expanded){
    const doneN = w.length - planned;
    const right = complete ? esc(E.compact(ex)) + ' ✓' : doneN + '/' + w.length;
    return '<div class="card collapsed" id="ex-' + i + '"><button class="exline' + (complete ? ' ok' : '') + '" data-act="expand" data-i="' + i + '"><b>' + esc(ex.n) + '</b><span class="cs">' + right + '</span></button></div>';
  }
  let h = '<div class="card" id="ex-' + i + '"><div class="exhead"><h3>' + esc(ex.n) + '</h3>'
    + '<button class="ib" data-act="info" data-i="' + i + '" aria-label="Details">ⓘ</button>'
    + '<button class="ib" data-act="exmenu" data-i="' + i + '" aria-label="Exercise menu">⋯</button></div>'
    + '<div class="tline">' + esc(targetLine(ex)) + '</div>';
  if(ui.info.has(i)){
    const prev = E.lastFor(ex.n, aH, S.draft.date);
    const top = ex.sets.filter(s => !s.warmup).map(s => s.state === 'planned' ? (s.target && s.target.kg) : s.kg).filter(v => v != null);
    const topKg = top.length ? Math.max(...top) : null;
    const pb = ex.bar ? E.plateBreak(topKg, ex.bar) : null;
    h += '<div class="info">'
      + (ex.tplNote ? '<p>' + esc(ex.tplNote) + '</p>' : '')
      + (ex.substitutedFor ? '<p>Swapped in for <b>' + esc(ex.substitutedFor) + '</b></p>' : '')
      + (prev ? '<p>Last (' + esc(E.niceDate(prev.date)) + '): <b>' + esc(E.summarise(prev.ex)) + '</b></p>'
        : ex.sets.some(s => s.target && s.target.src === 'seed') ? '<p>No previous data. The target is a starting point (bodyweight, or the programme’s number): change it if it is wrong.</p>'
        : '<p>No previous data: nothing to progress from yet.</p>')
      + (ex.rec ? '<p><span class="pill">' + esc(ex.rec.rule) + '</span>' + esc(ex.rec.why) + '</p>' : '')
      + (pb ? '<p>' + topKg + ' kg = <b>' + esc(pb) + '</b></p>' : '')
      + '<label>Note</label><input data-f="exnote" data-i="' + i + '" value="' + esc(ex.note || '') + '" placeholder="cues, pain, variation, how it felt">'
      + '</div>';
  }
  let wn = 0;
  ex.sets.forEach((st, j) => {
    const done = st.state !== 'planned', legacy = st.state === 'legacy';
    const n = st.warmup ? 'W' : String(++wn);
    h += '<div class="setrow' + (done ? ' done' : '') + (legacy ? ' legacy' : '') + (st.warmup ? ' warm' : '') + '"><span class="sn">' + n + '</span>'
      + '<button class="val" data-act="sheet" data-i="' + i + '" data-j="' + j + '">' + esc(E.setText(ex, st)) + '</button>'
      + '<button class="tick" data-act="tick" data-i="' + i + '" data-j="' + j + '" aria-label="' + (legacy ? 'Saved set: tap to edit' : done ? 'Untick' : 'Done as shown') + '">✓</button></div>';
  });
  const foot = [];
  const started = w.some(s => s.state !== 'planned');
  if(!started && ex.kind === 'weight' && E.loadOf(ex) === 'kg' && ex.sets.filter(s => s.warmup).length < 3)
    foot.push('<button data-act="warm" data-i="' + i + '">+ Warm-up</button>');
  if(planned) foot.push('<button data-act="bulk" data-i="' + i + '">All as shown ✓</button>');
  if(ui.open.has(i) && i !== cur) foot.push('<button data-act="collapse" data-i="' + i + '">Hide</button>');
  if(foot.length) h += '<div class="exfoot">' + foot.join('') + '</div>';
  return h + '</div>';
}

/* The effort question comes once per exercise, after its last set: only the
   last set's RIR drives progression, so asking after every set was noise. */
function renderRir(){
  const el = $('#rirRow');
  const d = S.draft;
  if(!ui.rir || !d || ui.tab !== 'log'){ el.hidden = true; el.innerHTML = ''; return; }
  const ex = d.exercises[ui.rir.i], st = ex && ex.sets[ui.rir.j];
  if(!st){ ui.rir = null; el.hidden = true; return; }
  el.hidden = false;
  el.className = 'last';
  el.innerHTML = '<div class="rirlab"><span class="grow">Last set: reps left? <span class="sub">' + esc(ex.n) + '</span></span>'
    + '<button class="ib" data-act="rirClose" aria-label="Skip">×</button></div><div class="chips">'
    + [0, 1, 2, 3, 4].map(v => '<button class="chip" data-act="rir" data-v="' + v + '">' + (v === 4 ? '4+' : v) + '</button>').join('') + '</div>';
}

/* The most frequent tap in a session, the next set's ✓, lives in the bottom
   bar where the thumb already is. It always targets the first planned set of
   the exercise in hand (warm-ups first), and opens the sheet when that set
   has nothing to copy. */
function nextSet(){
  const d = S.draft;
  if(!d || ui.tab !== 'log') return null;
  const i = currentIdx(d);
  if(i == null) return null;
  const ex = d.exercises[i], j = ex.sets.findIndex(s => s.state === 'planned');
  return j < 0 ? null : { i, j, ex, st: ex.sets[j] };
}
function renderNext(){
  const el = $('#nextSet'), n = nextSet();
  document.body.classList.toggle('next', !!n);
  if(!n){ el.hidden = true; el.innerHTML = ''; return; }
  const { ex, st, j } = n;
  const label = st.warmup ? 'warm-up' : 'set ' + ex.sets.filter((x, k) => !x.warmup && k <= j).length + ' of ' + ex.sets.filter(x => !x.warmup).length;
  const ok = E.canConfirm(ex, st);
  el.hidden = false;
  el.className = ok ? '' : 'enter';
  el.setAttribute('aria-label', (ok ? 'Done as shown: ' : 'Enter ') + ex.n + ' ' + label);
  el.innerHTML = '<span class="nx"><small>' + esc(ex.n) + ' · ' + esc(label) + '</small>'
    + (ok ? esc(E.setText(ex, st)) : 'Enter the numbers') + '</span><span class="ck">' + (ok ? '✓' : '✎') + '</span>';
}

/* ---------------------------------------------------------------- sheets */
function renderSheet(){
  const el = $('#sheet');
  const s = ui.sheet;
  if(!s){ el.innerHTML = ''; return; }
  let body = '', full = false;
  if(s.type === 'set') body = setSheet(s);
  else if(s.type === 'menu') body = menuSheet();
  else if(s.type === 'exmenu') body = exMenuSheet(s);
  else if(s.type === 'date') body = dateSheet();
  else if(s.type === 'routines') body = routinesSheet();
  else if(s.type === 'finish'){ body = finishSheet(s); full = true; }
  el.innerHTML = '<div class="scrim" data-act="closeSheet"></div><div class="panel' + (full ? ' full' : '') + '">' + (full ? '' : '<div class="grab"></div>') + body + '</div>';
  if(s.type === 'set') paintBar();
}

function stepRow(label, key, val, step){
  return '<label>' + esc(label) + '</label><div class="step">'
    + '<button data-act="shstep" data-k="' + key + '" data-d="' + (-step) + '" aria-label="Less">−</button>'
    + '<input type="text" inputmode="decimal" autocomplete="off" data-f="shval" data-k="' + key + '" value="' + esc(val ?? '') + '">'
    + '<button data-act="shstep" data-k="' + key + '" data-d="' + step + '" aria-label="More">+</button></div>';
}
function bandList(cur){
  const bands = (S.settings.bands && S.settings.bands.length ? S.settings.bands : E.DEFAULT_BANDS).slice();
  for(const b of String(cur || '').split('+').filter(Boolean)) if(!bands.includes(b)) bands.push(b);
  return bands;
}
function setSheet(s){
  const ex = S.draft.exercises[s.i], st = ex.sets[s.j], v = s.v, load = E.loadOf(ex);
  const n = st.warmup ? 'warm-up' : 'set ' + (ex.sets.filter((x, k) => !x.warmup && k <= s.j).length);
  let h = '<div class="sh-h"><span class="grow">' + esc(ex.n) + ' · ' + n + '</span><span class="shrest" id="shRest"></span></div>';
  if(ex.kind === 'weight' && load !== 'bw') h += stepRow(load === 'bw+' ? 'Added kg (0 = bodyweight)' : 'kg', 'kg', v.kg, ex.inc || 2.5);
  if(ex.kind === 'band'){
    const on = String(v.band || '').split('+');
    h += '<label>Band (tap every band used)</label><div class="chips small">' + bandList(v.band).map(b =>
      '<button class="chip' + (on.includes(b) ? ' on' : '') + '" data-act="shband" data-b="' + esc(b) + '">' + esc(b) + '</button>').join('') + '</div>';
  }
  if(ex.kind === 'distance'){ h += stepRow('kg', 'kg', v.kg, 2) + stepRow('metres', 'metres', v.metres, 5); }
  if(ex.kind === 'time') h += stepRow('seconds', 'seconds', v.seconds, 5);
  if(ex.kind === 'rounds') h += stepRow('rounds', 'rounds', v.rounds, 1);
  if(ex.kind === 'weight' || ex.kind === 'band' || ex.kind === 'reps') h += stepRow(ex.kind === 'reps' && /cm/.test(ex.n) ? 'cm' : 'reps', 'reps', v.reps, 1);
  if(ex.kind === 'weight' || ex.kind === 'band'){
    const vals = [0, 1, 2, 3, 4];
    if(v.rir != null && !vals.includes(v.rir)) vals.push(v.rir);
    h += '<label>RIR: reps left in the tank</label><div class="chips">' + vals.map(r =>
      '<button class="chip' + (v.rir === r ? ' on' : '') + '" data-act="shrir" data-v="' + r + '">' + (r === 4 ? '4+' : r) + '</button>').join('') + '</div>';
  }
  h += '<div class="row" style="margin-top:14px;justify-content:space-between">'
    + '<button class="toggle' + (v.warmup ? ' on' : '') + '" data-act="shwarm">' + (v.warmup ? 'Warm-up ✓' : 'Warm-up') + '</button>'
    + '<button class="textbtn" data-act="shdel">' + (s.delArm && Date.now() - s.delArm < 3000 ? 'Tap again to delete' : 'Delete set') + '</button></div>'
    + '<button class="save56" data-act="shsave">Save ✓</button>';
  return h;
}
function menuSheet(){
  const d = S.draft;
  const lift = E.isLiftKey(d.key);
  return '<div class="menu">'
    + '<button data-act="mdate">Change date <span class="sub">(' + esc(E.niceDate(d.date)) + ')</span></button>'
    + (lift ? '<button data-act="mdeload">Deload session: ' + (d.isDeload ? '<b>on</b>' : 'off') + '</button>' : '')
    + '<button data-act="mroutines">Add floor or stretching</button>'
    + '<button data-act="maddex">Add exercise</button>'
    + '<button data-act="mtab" data-tab="history">History</button>'
    + '<button data-act="mtab" data-tab="body">Body</button>'
    + '<button data-act="mtab" data-tab="settings">Settings</button>'
    + (ui.tab !== 'log' ? '<button data-act="mtab" data-tab="log">Back to the session</button>' : '')
    + '<button class="danger" data-act="discard">Discard session</button></div>';
}
/* Today's floor first, then every block of daily-floor.md on its own. A block
   already in the session is marked, and adding it again adds only what is
   missing. */
function routinesSheet(){
  const d = S.draft, have = new Set(d.exercises.map(e => e.n));
  const names = keys => keys.map(k => E.ROUTINES[k].name.split(' — ')[0]).join(' · ');
  const full = keys => keys.every(k => E.ROUTINES[k].ex.every(e => have.has(e.n)));
  const today = E.floorFor(d.date);
  let h = '<div class="sh-h">Add floor or stretching</div><div class="sub" style="margin-bottom:10px">After lifting is fine. Never before it: long holds make you weaker for the lift.</div><div class="menu">'
    + '<button data-act="maddroutine" data-k="' + today.join(',') + '"><b>Today’s floor</b><br><span class="sub">' + esc(names(today)) + (full(today) ? ' · already in' : '') + '</span></button>';
  for(const [k, r] of Object.entries(E.ROUTINES))
    h += '<button data-act="maddroutine" data-k="' + k + '">' + esc(r.name) + '<br><span class="sub">' + esc(r.when) + (full([k]) ? ' · already in' : '') + '</span></button>';
  return h + '</div>';
}
function exMenuSheet(s){
  const ex = S.draft.exercises[s.i];
  return '<div class="sh-h">' + esc(ex.n) + '</div><div class="menu">'
    + '<button data-act="swap" data-i="' + s.i + '">Swap for another exercise</button>'
    + '<button data-act="addset" data-i="' + s.i + '">Add set</button>'
    + '<button class="danger" data-act="delex" data-i="' + s.i + '">Delete exercise</button></div>';
}
function dateSheet(){
  return '<div class="sh-h">Session date</div>'
    + '<input type="date" data-f="dsdate" value="' + esc(S.draft.date) + '" max="' + today() + '">'
    + '<div class="hint">For a session done on an earlier day. Targets still to be ticked are recomputed from the sessions before that date.</div>'
    + '<button class="save56" data-act="dsSave">Save date</button>';
}

/* The finish sheet: nothing is written until Save. */
function finishSheet(s){
  const d = S.draft, aH = aHist();
  const res = E.finishSession(d, nowIso(), s.choice || undefined);
  const work = d.exercises.flatMap(ex => ex.sets.filter(st => !st.warmup && (st.state === 'planned' || E.hasData(st))));
  const ticked = work.filter(st => st.state !== 'planned').length;
  const plannedN = work.length - ticked;
  let h = '<div class="sh-h"><button class="ib" data-act="closeSheet" aria-label="Back">←</button><span class="grow">Finish ' + esc(d.name) + '</span></div>';
  h += '<div class="fsec" style="border-top:none">' + esc(E.niceDate(d.date, true))
    + ' · <button class="textbtn plain" data-act="fDate">change</button>'
    + (s.dateOpen ? '<input type="date" data-f="findate" value="' + esc(d.date) + '" max="' + today() + '">' : '') + '</div>';

  h += '<div class="fsec"><h4>' + ticked + ' of ' + work.length + ' working sets ticked</h4>';
  const noRir = [];
  for(const ex of d.exercises){
    const c = E.compact(ex);
    const r = E.rirRef(ex);
    const prev = E.lastFor(ex.n, aH, d.date);
    if(c && (ex.kind === 'weight' || ex.kind === 'band') && r == null) noRir.push(d.exercises.indexOf(ex));
    h += '<div class="sumline"><b>' + esc(ex.n) + '</b> ' + (c ? esc(c.replace(/ @[\d.]+$/, '')) : '<span class="sub">not done</span>')
      + (c && r != null ? ' · last-set RIR ' + r : '')
      + (prev ? ' <span class="sub">· last time ' + esc(E.compact(prev.ex)) + '</span>' : '') + '</div>';
  }
  /* Each opens the reps-left chips for that exercise's last set; one tap on a
     chip rates it and comes straight back here. */
  if(noRir.length) h += '<div class="hint">No RIR on the last set, so these cannot progress. Tap to rate:</div><div class="chips small" style="margin-top:6px">'
    + noRir.map(i => '<button class="chip" data-act="rateLast" data-i="' + i + '">' + esc(d.exercises[i].n) + '</button>').join('') + '</div>';
  h += '</div>';

  if(plannedN){
    const stuck = res.blocked === 'unticked' && s.choice === 'asShown' ? res.noTarget : 0;
    h += '<div class="fsec"><div class="warnbox"><b>' + plannedN + ' set' + (plannedN > 1 ? 's' : '') + ' not ticked.</b>'
      + '<div class="row"><button class="btn' + (s.choice === 'asShown' ? ' on' : '') + '" data-act="fChoice" data-v="asShown">I did them as shown</button>'
      + '<button class="btn' + (s.choice === 'drop' ? ' on' : '') + '" data-act="fChoice" data-v="drop">I didn’t do them</button></div>'
      + (stuck ? '<div class="hint">' + stuck + ' of them have no target to copy. Go back and enter them, or choose “I didn’t do them”.</div>' : '')
      + '</div></div>';
  }

  h += '<div class="fsec"><h4>Session RPE <span class="sub">(whole session, optional)</span></h4><div class="chips">'
    + [5, 6, 7, 8, 9, 10].map(v => '<button class="chip s48' + (d.sessionRpe === v ? ' on' : '') + '" data-act="fRpe" data-v="' + v + '">' + v + '</button>').join('') + '</div></div>';

  const sy = Array.isArray(d.symptoms) ? d.symptoms : null;
  const lb = sy && sy.find(x => x.area === 'low-back');
  const other = sy && sy.find(x => x.area === 'other');
  const lower = d.key === 'lower-a' || d.key === 'lower-b';
  h += '<div class="fsec' + (lower ? ' hl' : '') + '"><h4>Anything flare up?</h4><div class="chips">'
    + '<button class="chip' + (sy && !sy.length ? ' on' : '') + '" data-act="fSym" data-v="none">None</button>'
    + '<button class="chip' + (lb ? ' on' : '') + '" data-act="fSym" data-v="low-back">Low back</button>'
    + '<button class="chip' + (other ? ' on' : '') + '" data-act="fSym" data-v="other">Other</button></div>';
  if(lb){
    h += '<div class="chips" style="margin-top:8px">'
      + '<button class="chip' + (lb.type === 'tight' ? ' on' : '') + '" data-act="fLbType" data-v="tight">Tight</button>'
      + '<button class="chip' + (lb.type === 'pinch' ? ' on' : '') + '" data-act="fLbType" data-v="pinch">One-sided pinch</button></div>';
    if(lb.type === 'pinch'){
      h += '<div class="chips" style="margin-top:8px">'
        + ['L', 'R'].map(v => '<button class="chip' + (lb.side === v ? ' on' : '') + '" data-act="fLbSide" data-v="' + v + '">' + v + '</button>').join('') + '</div>'
        + '<div class="pinch">' + pinchText(E.pinchCount(S.settings.priorPinches, aH)) + '</div>';
    }
  }
  h += '</div>';

  h += '<div class="fsec">' + (s.noteOpen || d.notes
    ? '<h4>Note</h4><textarea data-f="notes" placeholder="Energy, sleep, anything the trainer should know">' + esc(d.notes) + '</textarea>'
    : '<button class="textbtn plain" data-act="fNote">Add note</button>') + '</div>';

  const blocked = !!res.blocked;
  const why = res.blocked === 'empty' ? 'Nothing performed and no note: nothing to save.' : res.blocked === 'unticked' && !s.choice ? 'Choose what happened to the unticked sets.' : '';
  h += '<button class="save56" data-act="saveSession"' + (blocked ? ' disabled' : '') + '>Save session</button>'
    + (why ? '<div class="hint center">' + esc(why) + '</div>' : '')
    + '<div class="center"><button class="textbtn plain" data-act="closeSheet">Back</button></div>';
  return h;
}

/* The count before the app lives in Settings on this phone, not in the
   page, which is public. Unset, it asks rather than under-counting. */
function pinchText(p){
  const rule = 'From the third on record: see a physiotherapist before the next hinge session.';
  if(p.total == null) return '<b>' + rule + '</b><div class="sub">Pinches logged in the app: ' + p.inApp + ' (including this one). Set how many came before the app in Settings to count this one.</div>';
  return '<b>Pinch #' + p.total + ' on record. ' + (p.physio ? 'See a physiotherapist before the next hinge session.' : rule) + '</b>'
    + '<div class="sub">' + p.inApp + ' logged in the app (including this one), ' + (p.total - p.inApp) + ' before it.</div>';
}

/* ---------------------------------------------------------------- history */
function viewHistory(){
  const list = merged();
  const pending = new Set(S.queue.filter(q => !q.deleted).map(q => E.fileKey(q)));
  let h = '<button class="rowbtn" data-act="pull"><span class="grow">Reload from GitHub</span></button>';
  if(!list.length) return h + '<div class="empty">No sessions yet.' + (sync.cfgOk() ? ' Reload to fetch them, or log one.' : ' Add a token in Settings first.') + '</div>';
  h += '<div class="card" style="padding:4px 12px">';
  for(const s of list){
    const k = E.fileKey(s);
    const suspect = E.isSuspectPrefill(s) && s.verified !== true;
    const pills = (pending.has(k) ? '<span class="pill warn">pending</span>' : '')
      + (s.logMode ? '<span class="pill' + (s.logMode === 'live' ? ' ok' : '') + '">' + esc(s.logMode) + '</span>' : '')
      + (s.isDeload ? '<span class="pill">deload</span>' : '')
      + (suspect ? '<span class="pill bad">unverified: excluded</span>' : '');
    h += '<div class="hist"><button class="hrow" data-act="hrow" data-k="' + esc(k) + '"><b class="grow">' + esc(s.name) + '</b><span class="sub">' + esc(E.niceDate(s.date)) + '</span>'
      + (pills ? '<span style="flex-basis:100%">' + pills + '</span>' : '') + '</button>';
    if(ui.hist.has(k)){
      const logged = (s.exercises || []).filter(e => E.working(e).length);
      const skipped = (s.exercises || []).filter(e => e.skipped);
      h += '<div class="hdet">'
        + (suspect ? '<p>Saved in under two minutes with every set equal to the suggestion and no RIR, so it may be a prefill that was never lifted. The rules ignore it until you confirm it or delete it. Editing it does not confirm it.</p>'
          + '<div class="row"><button class="btn primary" data-act="verify" data-k="' + esc(k) + '">It happened as recorded</button></div>' : '')
        + logged.map(e => '<div><b>' + esc(e.n) + '</b> ' + esc(E.summarise(e))
          + (e.substitutedFor ? ' <span class="pill">for ' + esc(e.substitutedFor) + '</span>' : '')
          + (e.note ? ' — ' + esc(e.note) : '') + '</div>').join('')
        + (skipped.length ? '<div>Not done: ' + esc(skipped.map(e => e.n).join(', ')) + '</div>' : '')
        + (s.sessionRpe != null ? '<div>Session RPE ' + esc(s.sessionRpe) + '</div>' : '')
        + (Array.isArray(s.symptoms) ? '<div>Flare-ups: ' + (s.symptoms.length ? esc(s.symptoms.map(x => x.area + (x.type ? ' ' + x.type : '') + (x.side ? ' ' + x.side : '')).join(', ')) : 'none') + '</div>' : '')
        + (s.notes ? '<div style="margin-top:6px">' + esc(s.notes) + '</div>' : '')
        + ((s.decisions || []).length ? '<div style="margin-top:6px">' + s.decisions.map(x =>
            esc(x.ex) + ': ' + esc(x.rule) + ' said ' + (x.recKg != null ? esc(x.recKg) + ' kg' : x.recBand ? esc(x.recBand) : '—') + ' → <b>' + esc(x.outcome) + '</b>').join('<br>') + '</div>' : '')
        + '<div class="row"><button class="btn" data-act="edit" data-k="' + esc(k) + '">Edit</button>'
        + '<button class="btn danger" data-act="del" data-k="' + esc(k) + '">Delete</button></div></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ---------------------------------------------------------------- body */
const FLOOR_MARKS = [
  ['kneeL','Knee-to-wall L (cm)'], ['kneeR','Knee-to-wall R (cm)'],
  ['squat','Deep squat, longest unbroken (s)'], ['pancake','Pancake — fingertips to floor (cm)'],
  ['hipRung','Hip flexor rung (1–5)'], ['hipHold','Hip flexor best hold (s)'],
  ['lsit','L-sit best (s)'], ['handstand','Wall handstand best (s)'], ['hang','Dead hang best (s)']
];
function allBw(){ return [...S.bwQueue.map(({qid, ...b}) => b), ...S.bw]; }
function viewBody(){
  const w = allBw().filter(b => b.type === 'bw' && b.kg);
  const last7 = w.filter(b => daysAgo(b.date) <= 7).map(b => b.kg);
  const prev7 = w.filter(b => daysAgo(b.date) > 7 && daysAgo(b.date) <= 14).map(b => b.kg);
  const a = E.median(prev7), b = E.median(last7);
  const trend = (a && b) ? ((b - a) / a * 100) : null;
  const marks = allBw().filter(x => x.type === 'floor');
  let h = '<div class="card"><h3>Bodyweight</h3>'
    + '<div class="sub">Log it on rest days too: gaps are what make the trend useless. Same time of day each time, ideally before 10:00.</div>'
    + '<label>Weight today (kg)</label>'
    + '<input type="text" inputmode="decimal" data-f="bwkg" placeholder="kg">'
    + '<button class="btn primary w100" style="margin-top:10px" data-act="logbw">Log ' + esc(E.niceDate(today())) + '</button>'
    + (last7.length
        ? '<div class="hint">7-day median <b>' + b.toFixed(1) + ' kg</b> from ' + last7.length + ' weigh-in' + (last7.length > 1 ? 's' : '')
          + (trend != null ? ' · ' + (trend > 0 ? '+' : '') + trend.toFixed(1) + '% on the week' : '')
          + (S.settings.phase === 'cut' ? ' · target −0.3 to −0.5%/week' : '') + '</div>'
        : '<div class="hint">No weigh-ins in the last 7 days.</div>')
    + '</div>';
  h += '<div class="card"><h3>Floor benchmark</h3><div class="sub">Every 4 weeks. These move too slowly to notice by feel.</div>'
    + FLOOR_MARKS.map(([k, lab]) => '<label>' + esc(lab) + '</label><input type="text" inputmode="decimal" data-mark="' + k + '">').join('')
    + '<button class="btn primary w100" style="margin-top:12px" data-act="logmark">Save benchmark</button></div>';
  if(marks.length){
    h += '<div class="card"><h3>Benchmark history</h3>' + marks.slice(0, 8).map(m => '<div class="hint"><b>' + esc(m.date) + '</b> '
      + FLOOR_MARKS.filter(([k]) => m[k] != null).map(([k, lab]) => esc(lab.replace(/ \(.*\)/, '')) + ' ' + esc(m[k])).join(' · ') + '</div>').join('') + '</div>';
  }
  if(w.length){
    h += '<div class="card"><h3>Weigh-ins</h3>' + w.slice(0, 20).map(x => '<div class="row" style="min-height:32px"><b class="grow">' + esc(x.kg) + ' kg</b><span class="sub">' + esc(x.date) + '</span></div>').join('') + '</div>';
  }
  return h;
}

/* ---------------------------------------------------------------- actions */
const ex_ = el => S.draft.exercises[+el.dataset.i];
const set_ = el => ex_(el).sets[+el.dataset.j];

function openSetSheet(i, j){
  const ex = S.draft.exercises[i], st = ex.sets[j];
  const v = { warmup: !!st.warmup, rir: st.rir ?? null };
  const src = st.state === 'planned' ? { ...(st.target || {}) } : {};
  for(const k of E.fieldsOf(ex)){ v[k] = st[k] ?? src[k] ?? null; }
  ui.sheet = { type:'set', i, j, v, delArm:0 };
  renderSheet();
}

/* After a working set is confirmed: rest, then (on the exercise's last set)
   the RIR question, then the next exercise moves to the top. */
function afterConfirm(i, j){
  const ex = S.draft.exercises[i], st = ex.sets[j];
  if(st.warmup){ save(); render(); return; }
  startRest(ex.rest);
  const remaining = ex.sets.some(s => !s.warmup && s.state === 'planned');
  if(!remaining){
    ui.rir = st.rir == null && (ex.kind === 'weight' || ex.kind === 'band') ? { i, j } : null;
    ui.open.delete(i);
    const nx = currentIdx(S.draft);
    if(nx != null) ui.scrollTo = nx;
  } else ui.rir = null;
  save(); render();
}

function goTab(t){ ui.tab = t; ui.sheet = null; window.scrollTo(0, 0); render(); }

function backToFinish(){
  const f = ui.finishBack; ui.finishBack = null;
  ui.sheet = f && f.type === 'finish' ? f : { type:'finish', choice:null, noteOpen:false, dateOpen:false };
  render();
}

function endSession(){
  S.draft = null; ui.sheet = null; ui.rir = null; ui.finishBack = null; ui.open.clear(); ui.info.clear();
  stopRest(); releaseWake();
}

const ACT = {
  tab: el => goTab(el.dataset.tab),
  mtab: el => goTab(el.dataset.tab),
  menu: () => { ui.sheet = { type:'menu' }; renderSheet(); },
  closeSheet: () => { ui.sheet = null; render(); },
  retry: () => sync.flushQueue(),
  pull: () => sync.pullHistory().then(render),
  undo: () => { const f = ui.undo; ui.undo = null; $('#toast').hidden = true; if(f) f(); },
  noticeOk: () => { ui.notice = null; render(); },

  start: el => {
    if(S.draft) return;
    const key = el.dataset.key, aH = aHist();
    const deload = E.isLiftKey(key) && E.deloadCheck(aH, S.bw, S.settings, today()).fire;
    const d = E.newSession(key, aH, today(), nowIso(), deload);
    d.id = newId();
    S.draft = d; ui.open.clear(); ui.info.clear(); ui.rir = null;
    save(); window.scrollTo(0, 0); render();
  },
  discard: () => {
    if(!confirm('Discard this session? Nothing from it has been pushed.')) return;
    endSession(); save(); render();
  },
  expand: el => { ui.open.add(+el.dataset.i); render(); },
  collapse: el => { ui.open.delete(+el.dataset.i); render(); },
  info: el => { const i = +el.dataset.i; ui.info.has(i) ? ui.info.delete(i) : ui.info.add(i); render(); },
  exmenu: el => { ui.sheet = { type:'exmenu', i:+el.dataset.i }; renderSheet(); },

  tickNext: () => {
    const n = nextSet();
    if(!n) return;
    if(!E.confirmSet(n.ex, n.st, 'tick', nowIso())){ openSetSheet(n.i, n.j); return; }
    afterConfirm(n.i, n.j);
  },
  tick: el => {
    const i = +el.dataset.i, j = +el.dataset.j, ex = ex_(el), st = set_(el);
    /* A set from a saved file is history: its ✓ opens it for editing rather
       than un-ticking it into a planned set that Finish could drop. */
    if(st.state === 'legacy'){ openSetSheet(i, j); return; }
    if(st.state === 'planned'){
      if(!E.confirmSet(ex, st, 'tick', nowIso())){ openSetSheet(i, j); return; }
      afterConfirm(i, j);
    } else {
      const before = E.clone(st);
      E.unconfirmSet(st);
      if(ui.rir && ui.rir.i === i && ui.rir.j === j) ui.rir = null;
      save(); render();
      toast('Set unticked', () => { if(S.draft && S.draft.exercises[i] === ex){ ex.sets[j] = before; save(); render(); } });
    }
  },
  warm: el => {
    const i = +el.dataset.i, ex = ex_(el);
    ex.sets.splice(E.warmupIndex(ex), 0, E.warmupSet(ex));
    ui.open.add(i); save(); render();
  },
  bulk: el => {
    const i = +el.dataset.i, ex = ex_(el), now = nowIso(), d = S.draft;
    const before = E.clone(ex.sets), rirBefore = ui.rir;
    let n = 0, last = null;
    ex.sets.forEach((st, j) => { if(!st.warmup && st.state === 'planned' && E.confirmSet(ex, st, 'bulk', now)) n++; });
    if(!n){ const j = ex.sets.findIndex(s => !s.warmup && s.state === 'planned'); toast('No target to copy yet: enter the first set.'); if(j >= 0) openSetSheet(i, j); return; }
    ex.sets.forEach((st, j) => { if(!st.warmup && st.state !== 'planned') last = j; });
    const left = ex.sets.filter(s => !s.warmup && s.state === 'planned').length;
    if(!left){
      ui.rir = last != null && ex.sets[last].rir == null && (ex.kind === 'weight' || ex.kind === 'band') ? { i, j:last } : null;
      ui.open.delete(i);
      const nx = currentIdx(S.draft); if(nx != null) ui.scrollTo = nx;
    }
    save(); render();
    /* One mis-tap here confirms a whole exercise, so it can be undone. */
    toast(n + ' set' + (n > 1 ? 's' : '') + ' confirmed as shown' + (left ? ' · ' + left + ' need numbers' : ''), () => {
      if(S.draft === d && d.exercises[i] === ex){ ex.sets = before; ui.rir = rirBefore; ui.open.add(i); save(); render(); }
    });
  },
  rir: el => {
    const r = ui.rir; if(!r) return;
    const st = S.draft.exercises[r.i] && S.draft.exercises[r.i].sets[r.j];
    if(st) st.rir = +el.dataset.v;
    ui.rir = null; save();
    if(r.back) backToFinish(); else render();
  },
  rirClose: () => { const r = ui.rir; ui.rir = null; if(r && r.back) backToFinish(); else render(); },
  rateLast: el => {
    const i = +el.dataset.i, ex = S.draft.exercises[i];
    let j = -1;
    ex.sets.forEach((st, k) => { if(!st.warmup && st.state !== 'planned' && E.hasData(st)) j = k; });
    if(j < 0) return;
    ui.finishBack = ui.sheet; ui.sheet = null;
    ui.rir = { i, j, back:true }; ui.scrollTo = i;
    render();
  },
  rest30: () => { if(rest.on){ rest.end += 30000; rest.buzzed = false; paintBar(); } },
  restStop: () => { if(rest.on) stopRest(); },

  sheet: el => openSetSheet(+el.dataset.i, +el.dataset.j),
  shstep: el => {
    const s = ui.sheet, ex = S.draft.exercises[s.i], k = el.dataset.k, d = +el.dataset.d;
    if(s.v[k] == null) s.v[k] = k === 'reps' && ex.rep ? ex.rep[0] : k === 'metres' && ex.dist ? ex.dist : Math.max(0, d);
    else s.v[k] = Math.max(0, Math.round((s.v[k] + d) * 100) / 100);
    renderSheet();
  },
  shband: el => {
    const s = ui.sheet, b = el.dataset.b;
    const on = new Set(String(s.v.band || '').split('+').filter(Boolean));
    on.has(b) ? on.delete(b) : on.add(b);
    s.v.band = on.size ? bandList(s.v.band).filter(x => on.has(x)).join('+') : null;
    renderSheet();
  },
  shrir: el => { const s = ui.sheet, r = +el.dataset.v; s.v.rir = s.v.rir === r ? null : r; renderSheet(); },
  shwarm: () => { ui.sheet.v.warmup = !ui.sheet.v.warmup; renderSheet(); },
  shdel: () => {
    const s = ui.sheet;
    if(!(s.delArm && Date.now() - s.delArm < 3000)){ s.delArm = Date.now(); renderSheet(); return; }
    const ex = S.draft.exercises[s.i];
    ex.sets.splice(s.j, 1);
    ui.sheet = null; if(ui.rir && ui.rir.i === s.i) ui.rir = null;
    save(); render();
  },
  shsave: () => {
    const s = ui.sheet, ex = S.draft.exercises[s.i], st = ex.sets[s.j], v = s.v;
    const miss = E.fieldsOf(ex).filter(k => v[k] == null);
    if(miss.length){ toast('Enter ' + miss.join(' and ') + ' first.'); return; }
    for(const k of E.fieldsOf(ex)) st[k] = v[k];
    if(ex.kind === 'weight' || ex.kind === 'band') st.rir = v.rir;
    st.warmup = !!v.warmup;
    if(st.state !== 'done' || !st.doneAt) st.doneAt = nowIso();
    st.state = 'done'; st.via = 'sheet';
    if(!st.warmup) E.carryForward(ex, s.j);
    ui.sheet = null;
    afterConfirm(s.i, s.j);
  },

  swap: el => {
    const i = +el.dataset.i, ex = S.draft.exercises[i];
    const n = prompt('Swapped in what instead of "' + ex.n + '"?', '');
    if(!n || !n.trim()) return;
    /* Kept as a substitution, not logged under the prescribed name, or the
       history quietly becomes fiction. */
    ex.substitutedFor = ex.substitutedFor || ex.n;
    ex.n = n.trim();
    const { rec, target } = E.targets(E.tplOf(ex), aHist(), S.draft.date, S.draft.isDeload);
    ex.rec = rec;
    for(const st of ex.sets) if(st.state === 'planned') st.target = target ? { ...target } : null;
    ui.sheet = null; save(); render();
  },
  addset: el => {
    const ex = S.draft.exercises[+el.dataset.i];
    const lastT = [...ex.sets].reverse().find(s => s.target);
    ex.sets.push(E.blankSet(ex, lastT ? lastT.target : null));
    ui.open.add(+el.dataset.i); ui.sheet = null; save(); render();
  },
  delex: el => {
    const i = +el.dataset.i, ex = S.draft.exercises[i], d = S.draft;
    d.exercises.splice(i, 1);
    ui.sheet = null; ui.open.clear(); ui.info.clear(); if(ui.rir) ui.rir = null;
    save(); render();
    toast('Deleted ' + ex.n, () => { if(S.draft === d){ d.exercises.splice(Math.min(i, d.exercises.length), 0, ex); save(); render(); } });
  },

  mdate: () => { ui.sheet = { type:'date' }; renderSheet(); },
  dsSave: () => {
    const v = ($('[data-f="dsdate"]') || {}).value;
    if(v && v <= today()){ S.draft.date = v; E.retarget(S.draft, aHist()); save(); }
    ui.sheet = null; render();
  },
  mdeload: () => { S.draft.isDeload = !S.draft.isDeload; E.retarget(S.draft, aHist()); ui.sheet = null; save(); render(); },
  mroutines: () => { ui.sheet = { type:'routines' }; renderSheet(); },
  maddroutine: el => {
    const d = S.draft, keys = el.dataset.k.split(',');
    const add = E.routineExercises(keys, aHist(), d.date, d.exercises.map(e => e.n));
    ui.sheet = null; ui.tab = 'log';
    if(!add.length){ render(); toast('Already in this session'); return; }
    const first = d.exercises.length;
    d.exercises.push(...add);
    ui.open.add(first); ui.scrollTo = first; save(); render();
    toast('Added ' + add.length + ' exercise' + (add.length > 1 ? 's' : ''));
  },
  maddex: () => {
    const n = prompt('Exercise name', '');
    if(!n || !n.trim()) return;
    S.draft.exercises.push(E.customExercise(n.trim()));
    const i = S.draft.exercises.length - 1;
    ui.open.add(i); ui.sheet = null; ui.scrollTo = i; ui.tab = 'log'; save(); render();
  },

  finish: () => { ui.sheet = { type:'finish', choice:null, noteOpen:false, dateOpen:false }; renderSheet(); },
  fDate: () => { ui.sheet.dateOpen = !ui.sheet.dateOpen; renderSheet(); },
  fChoice: el => { ui.sheet.choice = el.dataset.v; renderSheet(); },
  fRpe: el => { const v = +el.dataset.v; S.draft.sessionRpe = S.draft.sessionRpe === v ? null : v; save(); renderSheet(); },
  fSym: el => {
    const d = S.draft, v = el.dataset.v;
    let sy = Array.isArray(d.symptoms) ? d.symptoms.slice() : null;
    if(v === 'none') sy = sy && !sy.length ? null : [];
    else {
      sy = sy || [];
      const has = sy.find(x => x.area === v);
      sy = has ? sy.filter(x => x.area !== v) : [...sy, { area:v, type:null, side:null }];
      if(!sy.length) sy = null;
    }
    d.symptoms = sy; save(); renderSheet();
  },
  fLbType: el => { const lb = S.draft.symptoms.find(x => x.area === 'low-back'); lb.type = lb.type === el.dataset.v ? null : el.dataset.v; if(lb.type !== 'pinch') lb.side = null; save(); renderSheet(); },
  fLbSide: el => { const lb = S.draft.symptoms.find(x => x.area === 'low-back'); lb.side = lb.side === el.dataset.v ? null : el.dataset.v; save(); renderSheet(); },
  fNote: () => { ui.sheet.noteOpen = true; renderSheet(); const t = $('[data-f="notes"]'); if(t) t.focus(); },
  saveSession: () => {
    const d = S.draft, now = nowIso();
    const res = E.finishSession(d, now, ui.sheet && ui.sheet.choice || undefined);
    if(res.blocked){ toast(res.blocked === 'empty' ? 'Nothing to save yet.' : 'Choose what happened to the unticked sets.'); return; }
    const plan = E.planSave(d, res.session, S.history, S.queue, dir(), now);
    for(const item of plan.items) sync.enqueue(item);
    endSession(); save(); render();
    toast('Saved' + (sync.cfgOk() ? '' : ' on this phone'));
    sync.flushQueue();
  },

  hrow: el => { const k = el.dataset.k; ui.hist.has(k) ? ui.hist.delete(k) : ui.hist.add(k); render(); },
  edit: el => {
    const item = merged().find(s => E.fileKey(s) === el.dataset.k);
    if(!item) return;
    if(S.draft && !confirm('Replace the session in progress?')) return;
    const d = E.editDraft(item, dir());
    if(!d.id) d.id = newId();
    endSession(); S.draft = d; ui.tab = 'log'; save(); window.scrollTo(0, 0); render();
  },
  del: el => {
    const k = el.dataset.k;
    const raw = [...S.queue].reverse().find(q => !q.deleted && E.fileKey(q) === k) || S.history.find(h => E.fileKey(h) === k);
    if(!raw) return;
    if(!confirm('Delete ' + raw.name + ' on ' + raw.date + '? The file is marked deleted, and git keeps every earlier version.')) return;
    const { qid, ...body } = raw;
    /* Queued before history is touched: a tombstone is only pushed for a file
       GitHub already holds, and history is how sync knows that. */
    sync.enqueue({ ...body, deleted:true, savedAt:nowIso() });
    S.history = S.history.filter(h => E.fileKey(h) !== k);
    save(); render(); sync.flushQueue();
  },
  /* Confirms a suspect session: the file gets verified:true and nothing
     else changes, so the rules read it from now on. */
  verify: el => {
    const k = el.dataset.k;
    const raw = [...S.queue].reverse().find(q => !q.deleted && E.fileKey(q) === k) || S.history.find(h => E.fileKey(h) === k);
    if(!raw) return;
    if(!confirm('Confirm ' + raw.name + ' on ' + raw.date + ' was lifted as recorded? It will count toward the next targets.')) return;
    const { qid, unverified, ...body } = raw;
    sync.enqueue({ ...body, verified:true });
    ui.hist.delete(k); render(); sync.flushQueue();
  },

  logbw: () => {
    const v = num(($('[data-f="bwkg"]') || {}).value);
    if(v == null || v < 30 || v > 250){ toast('Enter a weight in kg first.'); return; }
    sync.enqueueBw({ type:'bw', date:today(), kg:v, loggedAt:nowIso() });
    render(); toast('Logged ' + v + ' kg'); sync.flushQueue();
  },
  logmark: () => {
    const e = { type:'floor', date:today(), loggedAt:nowIso() };
    let any = false;
    FLOOR_MARKS.forEach(([k]) => { const v = num(($('[data-mark="' + k + '"]') || {}).value); if(v != null){ e[k] = v; any = true; } });
    if(!any){ toast('Nothing filled in.'); return; }
    sync.enqueueBw(e); render(); sync.flushQueue();
  },
  savecfg: () => { save(); setSync('', 'saved'); sync.flushQueue({ quiet:true }).then(render); },
  test: async () => {
    save();
    try{
      const r = await sync.testRepo();
      if(!r) throw new Error('repo not found');
      setSync('ok', 'connected');
      alert('Connected to ' + r.full_name + '\nPrivate: ' + r.private + '\nWrite access: ' + (r.permissions && r.permissions.push ? 'yes' : 'NO: token lacks Contents: write'));
    }catch(e){ setSync('bad', 'failed'); alert('Failed: ' + e.message); }
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ history:S.history, bw:S.bw, queue:S.queue, bwQueue:S.bwQueue, draft:S.draft, corrupt:corruptBackups() }, null, 2)], { type:'application/json' });
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = 'ledger-backup-' + today() + '.json'; a.click(); URL.revokeObjectURL(u);
  }
};

const INPUT = {
  exnote: el => { S.draft.exercises[+el.dataset.i].note = el.value; save(); },
  shval: el => { if(ui.sheet) ui.sheet.v[el.dataset.k] = num(el.value); },
  notes: el => { S.draft.notes = el.value; save(); }
};
const CHANGE = {
  findate: el => {
    if(!el.value || el.value > today()) return;
    S.draft.date = el.value; E.retarget(S.draft, aHist()); save(); renderSheet(); render();
  },
  cfg: el => {
    const k = el.dataset.k;
    if(k === 'deloadWeeks') S.settings[k] = parseInt(el.value, 10) || 5;
    else if(k === 'priorPinches'){ const n = parseInt(el.value, 10); S.settings[k] = Number.isFinite(n) && n >= 0 ? n : null; }
    else if(k === 'bands') S.settings.bands = el.value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    else S.settings[k] = el.value.trim();
    save();
  },
  cfgbool: el => { S.settings[el.dataset.k] = el.checked; save(); if(el.dataset.k === 'wakeLock') syncWake(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn) fn(el, e);
});
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if(f && INPUT[f]) INPUT[f](e.target); });
document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f; if(f && CHANGE[f]) CHANGE[f](e.target); });

/* ---------------------------------------------------------------- boot */
save();
const pending = S.queue.length + S.bwQueue.length;
setSync(pending ? 'pending' : '', pending ? pending + ' pending' : (sync.cfgOk() ? 'ready' : 'no token'));
render();
try{
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(p => p || navigator.storage.persist())
      .then(p => { ui.persist = p ? 'persistent' : 'best-effort'; if(ui.tab === 'settings') softRender(); }).catch(() => { ui.persist = 'best-effort'; });
  } else ui.persist = 'best-effort';
}catch(e){ ui.persist = 'best-effort'; }
if(sync.cfgOk()) sync.flushQueue({ quiet:true }).then(() => { if(!S.history.length) return sync.pullHistory(); }).then(softRender);
window.addEventListener('online', () => sync.flushQueue({ quiet:true }));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
